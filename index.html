function seedOf(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const looksCode=s=>/[;{}\[\]]|\w\(|==|\+=|\.length|^\{/.test(s);

/* ---------- Quiz component ---------- */
let QUIZ=null; // {list, state:{qid:{first:bool|null, solved:bool}}}
function quizHTML(list,{groupByTopic=false,showTopic=false}={}){
  QUIZ={list,state:{}};
  let html=`<div class="quizbar"><span class="score" id="score"></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="showall">Show all answers</button><button class="btn" id="resetq">Reset</button></span></div><div class="qlist">`;
  let lastTopic=null;
  list.forEach((q,n)=>{
    if(groupByTopic&&q.topic!==lastTopic){lastTopic=q.topic;html+=`<div class="qgroup">${q.topic} ${BY_ID[q.topic].title}</div>`}
    const order=shuffled(q.opts.length,seedOf(q.qid));
    html+=`<div class="check q mcq" data-qid="${q.qid}">
      <div class="qn"><span>Question ${n+1}</span>${showTopic?`<a href="#t${q.topic}">Topic ${q.topic}</a>`:""}</div>
      <p>${q.stem}</p>${q.code?`<pre><code>${hl(q.code)}</code></pre>`:""}
      <div class="opts" role="group" aria-label="Answer choices for question ${n+1}">${order.map((oi,k)=>`<button class="opt${looksCode(q.opts[oi])?" code":""}" data-oi="${oi}"><b>${"ABCDE"[k]}</b><span>${esc(q.opts[oi])}</span></button>`).join("")}</div>
      <div class="answer" hidden></div></div>`;
  });
  return html+`</div>`;
}
function updateScore(){
  const st=Object.values(QUIZ.state),n=QUIZ.list.length;
  const answered=st.filter(s=>s.solved).length,first=st.filter(s=>s.first===true).length;
  const el=document.getElementById("score");
  if(el)el.innerHTML=`${first} / ${n} correct on first try <small>· ${answered} of ${n} answered</small>`;
}
function reveal(card,q,msg){
  card.querySelectorAll(".opt").forEach(o=>{o.classList.remove("wrong");if(+o.dataset.oi===0)o.classList.add("right")});
  const fb=card.querySelector(".answer");fb.hidden=false;fb.innerHTML=`${msg}${esc(q.expl)}`;
}
function wireQuiz(){
  const byId={};QUIZ.list.forEach(q=>byId[q.qid]=q);
  content.querySelectorAll(".q").forEach(card=>{
    const q=byId[card.dataset.qid];
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const s=QUIZ.state[q.qid]||(QUIZ.state[q.qid]={first:null,solved:false});
      if(s.solved)return;
      const right=+b.dataset.oi===0;
      if(s.first===null)s.first=right;
      if(right){s.solved=true;reveal(card,q,`<strong class="ok">Correct.</strong> `)}
      else{b.classList.add("wrong");const fb=card.querySelector(".answer");fb.hidden=false;fb.innerHTML=`<strong class="no">Not quite.</strong> Try another choice.`}
      updateScore();
    });
  });
  document.getElementById("showall").onclick=()=>{
    content.querySelectorAll(".q").forEach(card=>{const q=byId[card.dataset.qid];const s=QUIZ.state[q.qid]||(QUIZ.state[q.qid]={first:null,solved:false});s.solved=true;reveal(card,q,`<strong class="ok">Answer:</strong> `)});
    updateScore();
  };
  document.getElementById("resetq").onclick=()=>{const y=scrollY;route(true);scrollTo(0,y)};
  updateScore();
}

/* ---------- Navigation ---------- */
const nav=document.getElementById("nav");
function buildNav(filter=""){
  const f=filter.trim().toLowerCase();let html="",hits=0;
  UNITS.forEach(u=>{
    const items=u.topics.filter(t=>!f||(t[0]+" "+t[1]).toLowerCase().includes(f));
    if(!items.length)return;hits+=items.length;
    const nq=u.topics.reduce((s,t)=>s+quizFor(t[0]).length,0);
    html+=`<div class="unit"><button aria-expanded="true">Unit ${u.n} · ${u.name}<span>${u.weight}</span></button><ul>`+
      (f?"":`<li><a class="uq" href="#u${u.n}" data-page="u${u.n}"><span class="n">Quiz</span>Unit ${u.n} quiz · ${nq} questions</a></li>`)+
      items.map(t=>`<li><a href="#t${t[0]}" data-id="${t[0]}"><span class="n">${t[0]}</span>${t[1]}</a></li>`).join("")+`</ul></div>`;
  });
  nav.innerHTML=hits?html:`<p class="empty">No topics match “${esc(filter)}”.</p>`;
  nav.querySelectorAll(".unit>button").forEach(b=>b.onclick=()=>{const ul=b.nextElementSibling;ul.hidden=!ul.hidden;b.setAttribute("aria-expanded",!ul.hidden)});
  markNav();
}
function currentPage(){const h=location.hash.slice(1);return h||"home"}
function markNav(){
  const p=currentPage();
  document.querySelectorAll("#side a").forEach(a=>{
    const on=a.dataset.id?("t"+a.dataset.id)===p:a.dataset.page===p;
    a.classList.toggle("active",on);
    if(a.dataset.id)a.classList.toggle("isdone",!!done[a.dataset.id]);
  });
  const n=Object.keys(done).filter(k=>done[k]).length;
  document.getElementById("ptext").textContent=`${n} of ${ALL.length} lessons done`;
  document.getElementById("pbar").style.width=(n/ALL.length*100)+"%";
}

function renderTopic(id,keep){
  const i=ALL.findIndex(t=>t.id===id);if(i<0)return renderHome();
  const t=ALL[i],prev=ALL[i-1],next=ALL[i+1];
  const N=NOTES[t.id];
  const rows=N.lo.map(([code,obj,eks])=>`<tr><td class="lo"><b>${code}</b>${obj}</td><td><ul class="eks">${eks.map(([c,s])=>c==="EXCL"?`<li class="excl"><span>Not on the exam</span>${s}</li>`:`<li><b>${c}</b>${s}</li>`).join("")}</ul></td></tr>`).join("");
  const secs=N.secs.map((s,k)=>`<section class="nsec"><h3>${k+1}. ${s.h}</h3>${s.p}
    <div class="codehead"><span>Example</span><button class="btn" data-copy="${k}">Copy code</button></div>
    <pre id="code${k}"><code>${hl(s.code)}</code></pre>
    <div class="how"><span>How it works</span><ol>${s.logic.map(l=>`<li>${l}</li>`).join("")}</ol></div></section>`).join("");

  <h2>Full notes</h2>
  ${secs}

    :`<p class="lede">No 2023–2026 FRQ is built around this topic, but it supports the ones in this unit. See <a href="#frq">all past FRQs</a> or the <a href="#u${t.unit.n}">Unit ${t.unit.n} quiz</a>.</p>`}
  <h2>AP Classroom</h2>
  <div class="classroom">Assign the College Board <strong>Topic Questions for ${t.id}</strong> in <a href="https://apclassroom.collegeboard.org" target="_blank" rel="noopener">AP Classroom</a>.${lastInUnit?` This is the last lesson in Unit ${t.unit.n}: assign the <strong>Unit ${t.unit.n} Progress Check</strong> (multiple-choice and free-response) and the <a href="#u${t.unit.n}">Unit ${t.unit.n} quiz</a>.`:""}</div>
  <div class="foot">

function copyCode(b,text,node){
  navigator.clipboard.writeText(text).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy code",1500)})
  .catch(()=>{const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Press Ctrl+C"});
}

function route(keep){
  const p=currentPage();
  if(p.startsWith("t"))renderTopic(p.slice(1));
  else if(/^u[1-4]$/.test(p))renderUnitQuiz(+p[1]);
  else if(p==="frq")renderFRQ();
  else if(p==="practice")renderPractice();
  else renderHome();
  markNav();if(keep!==true)window.scrollTo(0,0);
  side.classList.remove("open");menu.setAttribute("aria-expanded","false");
}
const side=document.getElementById("side"),menu=document.getElementById("menu");
menu.onclick=()=>{const o=side.classList.toggle("open");menu.setAttribute("aria-expanded",o)};
document.getElementById("search").addEventListener("input",e=>buildNav(e.target.value));
addEventListener("hashchange",()=>route());
buildNav();route();
