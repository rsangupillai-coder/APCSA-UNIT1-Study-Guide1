<style>
/* Layout: fixed course sidebar (units → topics) + one reading column; collapses to a drawer on phones */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212e; --muted:#5a6676; --line:#dfe3ea;

  --kw:#7cc4ff; --str:#f2c879; --com:#7f93a6; --num:#c9a0ff; --done:#2e8b57; --no:#c0392b; --warn-bg:#fff5df; --warn-ink:#6b4b00;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --panel:#16202a; --ink:#e4eaf1; --muted:#9aa8b8; --line:#273443;
  --accent:#5cc2b8; --accent-soft:#17312f; --code-bg:#0a1118; --code-fg:#dbe6ef; --done:#5fcf8f; --no:#ff8a7a; --warn-bg:#2e2611; --warn-ink:#f3d58c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --panel:#16202a; --ink:#e4eaf1; --muted:#9aa8b8; --line:#273443;
  --accent:#5cc2b8; --accent-soft:#17312f; --code-bg:#0a1118; --code-fg:#dbe6ef; --done:#5fcf8f; --no:#ff8a7a; --warn-bg:#2e2611; --warn-ink:#f3d58c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);margin:0}
a{color:var(--accent)}

.navlink:hover{background:var(--accent-soft)}

.unit{margin-top:16px}

.unit>button span{font:500 .72rem var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.unit ul{list-style:none;margin:6px 0 0;padding:0}

.topbar{display:none}

.lede{color:var(--muted);max-width:65ch;margin:0}

code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}

.k{color:var(--kw)} .s{color:var(--str)} .c{color:var(--com);font-style:italic} .d{color:var(--num)}

.mcq pre{margin:4px 0 14px}

.toplinks{display:grid;gap:2px;margin-top:12px}

ul.eks b{display:block;font-family:var(--mono);font-size:.76rem;color:var(--accent);font-weight:600}

.how{margin-top:10px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0}

.eq ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.quizbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.score{font-weight:600;font-variant-numeric:tabular-nums}

.qlist{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.qlist>*,.opts>*,.frqlist>*{min-width:0}
.opts{grid-template-columns:minmax(0,1fr)}
.q .qn{font:600 .74rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.q .qn a{text-transform:none;letter-spacing:0;font-weight:500}
.opt.code span{font-family:var(--mono);font-size:.86rem}
.qgroup{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:22px 0 2px}
.qgroup:first-child{margin-top:0}
.frqyear{margin-top:28px}
.frqyear h2{margin:0 0 4px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.links a{font-size:.88rem;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 11px;background:var(--panel)}

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags a{font-family:var(--mono);font-size:.74rem;text-decoration:none;background:var(--accent-soft);padding:1px 6px;border-radius:4px}
td.frqt{width:28%}

td.frqt span{font-size:.8rem;color:var(--muted)}

.frqitem .meta{font-size:.8rem;color:var(--muted)}
.frqitem strong{font-family:var(--display)}
.frqitem p{margin:6px 0}
.pf{margin-top:34px;padding-top:6px;border-top:1px solid var(--line)}
.pf h2{margin-top:18px}
.pf h3{font:600 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.classroom{border:1px dashed var(--accent);border-radius:8px;padding:12px 16px;font-size:.93rem}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:16px 0 4px}
.stats div{display:flex;flex-direction:column}

.eqlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.eqlist li{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}

  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}

<script>
const UNITS=[
 {n:1,name:"Using Objects and Methods",weight:"15–25%",topics:[
  ["1.1","Introduction to Algorithms, Programming, and Compilers",
   [["Describe how an algorithm becomes a running program.","An <em>algorithm</em> is a step-by-step process that solves a problem. Writing it out in plain steps first makes the code easier to write.","Java source code is compiled into bytecode, which the Java Virtual Machine runs.","The compiler reports <em>syntax errors</em>; a program can still compile and have <em>logic errors</em> (wrong output) or <em>run-time errors</em> (crashes such as dividing an int by zero)."]],
   `// The smallest complete Java program
public class Hello {
    public static void main(String[] args) {
        System.out.println("Hello, PCTI!");
    }
}`,
   "A program compiles, runs, and prints the wrong total. What kind of error is that?","A logic error. The syntax is valid and nothing crashed, but the algorithm or code does the wrong thing."],
  ["1.2","Variables and Data Types",
   [["Choose the right category of data type for a value.","A data type is a set of values plus the operations allowed on them.","Types are either <em>primitive</em> (store the value directly) or <em>reference</em> (store the location of an object)."],
    ["Declare variables that hold numbers and true/false values.","This course uses three primitive types: <code>int</code> (whole numbers), <code>double</code> (real numbers), and <code>boolean</code> (<code>true</code>/<code>false</code>).","A variable is a named storage location whose value can change while the program runs. Every variable has a name and a type."]],
   `int studentsInClass = 24;
double gpa = 3.85;
boolean isEnrolled = true;
String school = "PCTI";   // String is a reference type`,
   "Which type should store whether a door is locked?","<code>boolean</code>. There are only two possible values: locked (true) or not (false).",
   "The other primitive types (<code>long</code>, <code>short</code>, <code>byte</code>, <code>float</code>, <code>char</code>) are not tested on the AP exam."],
  ["1.3","Expressions and Output",
   [["Evaluate arithmetic expressions.","Operators: <code>+ - * / %</code>. Normal precedence applies: <code>* / %</code> before <code>+ -</code>, left to right.","int / int gives an int: the decimal part is truncated (<code>7 / 2</code> is <code>3</code>).","<code>%</code> gives the remainder: <code>7 % 2</code> is <code>1</code>.","If either operand is a double, the result is a double."],
    ["Print output to the console.","<code>System.out.println</code> moves to a new line after printing; <code>System.out.print</code> does not.","Escape sequences: <code>\\\"</code>, <code>\\\\</code>, <code>\\n</code>."]],
   `System.out.println(7 / 2);      // 3
System.out.println(7.0 / 2);    // 3.5
System.out.println(17 % 5);     // 2
System.out.print("Score: ");
System.out.println(90 + 5);     // Score: 95`,
   "What does <code>System.out.println(2 + 3 * 4 % 5);</code> print?","<code>4</code>. 3 * 4 = 12, 12 % 5 = 2, then 2 + 2 = 4."],
  ["1.4","Assignment Statements and Input",
   [["Trace how assignment changes a variable's value.","<code>=</code> evaluates the right side first, then stores the result in the variable on the left.","A variable must be declared and given a value before it is used.","Assigning a new value replaces the old one."],
    ["Read input from the user.","The <code>Scanner</code> class reads keyboard input: <code>nextInt()</code>, <code>nextDouble()</code>, <code>nextLine()</code>."]],
   `import java.util.Scanner;

Scanner in = new Scanner(System.in);
System.out.print("How many laps? ");
int laps = in.nextInt();
int distance = laps * 400;   // meters
System.out.println(distance + " m");`,
   "After <code>int a = 5; int b = a; a = 9;</code> what is <code>b</code>?","<code>5</code>. b got a copy of a's value at the time of assignment. Changing a later does not change b."],
  ["1.5","Casting and Range of Variables",
   [["Convert between int and double.","<code>(int)</code> casts a double to an int by truncating the decimal (<code>(int) 3.99</code> is <code>3</code>).","<code>(double)</code> casts an int to a double; an int is also widened automatically when needed.","To round a positive double: <code>(int)(x + 0.5)</code>. For a negative: <code>(int)(x - 0.5)</code>."],
    ["Explain int range limits.","An int is stored in 4 bytes, so its range is <code>Integer.MIN_VALUE</code> to <code>Integer.MAX_VALUE</code>.","Going past the range causes <em>integer overflow</em>: the value wraps around.","Doubles can have small round-off errors because of limited precision."]],
   `double avg = 87.6;
int whole = (int) avg;               // 87
int rounded = (int) (avg + 0.5);     // 88
double exact = (double) 7 / 2;       // 3.5
int big = Integer.MAX_VALUE + 1;     // wraps to MIN_VALUE`,
   "What is <code>(double)(7 / 2)</code>?","<code>3.0</code>. The integer division happens first inside the parentheses (giving 3), then 3 is cast to 3.0."],
  ["1.6","Compound Assignment Operators",
   [["Use shortcut operators to update a variable.","<code>x += 5</code> means <code>x = x + 5</code>. Same idea for <code>-= *= /= %=</code>.","<code>x++</code> adds 1; <code>x--</code> subtracts 1. On the AP exam these are used only as standalone statements."]],
   `int score = 10;
score += 5;   // 15
score *= 2;   // 30
score %= 7;   // 2
score++;      // 3`,
   "Start with <code>int n = 20;</code> then run <code>n /= 3; n -= 1;</code>. What is n?","<code>5</code>. 20 / 3 is 6 (integer division), then 6 - 1 = 5."],
  ["1.7","Application Program Interface (API) and Libraries",
   [["Explain how libraries and APIs let us reuse code.","A <em>library</em> is a collection of classes someone already wrote and tested.","An <em>API</em> tells you how to use those classes: which methods exist, what they take, and what they return.","Classes are grouped into <em>packages</em> such as <code>java.util</code>; use <code>import</code> to bring them in."],
    ["Identify attributes and behaviors of a class.","Attributes are the data an object stores (instance variables). Behaviors are what it can do (methods)."]],
   `import java.util.ArrayList;   // from the java.util package
import java.util.Scanner;

// java.lang (String, Math, Integer) is imported automatically`,
   "Why don't you need an import for <code>Math</code> or <code>String</code>?","They are in the <code>java.lang</code> package, which Java imports into every program automatically."],
  ["1.8","Documentation with Comments",
   [["Write comments that explain code.","<code>//</code> single line, <code>/* */</code> multi-line, <code>/** */</code> Javadoc. The compiler ignores comments.","A <em>precondition</em> is what must be true before a method is called. A <em>postcondition</em> is what is true after it runs.","Methods do not have to check their preconditions; the caller is responsible."]],
   `/**
 * Returns the average of two test scores.
 * Precondition: a and b are between 0 and 100.
 * Postcondition: returns a value between 0.0 and 100.0.
 */
public static double average(int a, int b) {
    return (a + b) / 2.0;
}`,
   "Who is responsible for making sure a precondition is met?","The code that calls the method. The method can assume the precondition is true."],
  ["1.9","Method Signatures",

   [["Trace linear and binary search.","<em>Linear search</em> checks each element in order. Works on any list.","<em>Binary search</em> needs sorted data; it checks the middle and discards half each step.","Binary search makes far fewer comparisons on large data sets."]],
   `public static int binarySearch(int[] a, int target) {
    int lo = 0, hi = a.length - 1;
    while (lo <= hi) {
        int mid = (lo + hi) / 2;
        if (a[mid] == target) return mid;
        if (a[mid] < target) lo = mid + 1;
        else hi = mid - 1;
    }
    return -1;
}`,
   "A linear search looks for a value that is not in an unsorted array of 1,000 items. How many elements does it check?","All 1,000. It can only conclude the value is missing after checking every element."],

   [["Trace selection sort and insertion sort.","<em>Selection sort</em>: find the smallest remaining element and swap it into the next position.","<em>Insertion sort</em>: take the next element and shift larger sorted elements right to insert it.","Know what the array looks like after each pass."]],
   `public static void selectionSort(int[] a) {
    for (int i = 0; i < a.length - 1; i++) {
        int min = i;
        for (int j = i + 1; j < a.length; j++) {
            if (a[j] < a[min]) min = j;
        }
        int temp = a[i]; a[i] = a[min]; a[min] = temp;
    }
}`,

   `public static int factorial(int n) {
    if (n <= 1) return 1;          // base case
    return n * factorial(n - 1);   // recursive call
}

   `public static int search(int[] a, int t, int lo, int hi) {
    if (lo > hi) return -1;
    int mid = (lo + hi) / 2;
    if (a[mid] == t) return mid;
    if (a[mid] < t) return search(a, t, mid + 1, hi);

}`,

 {t:"TrainingLog",type:"Methods and control structures",units:"Units 1–2",
  prompt:"A runner logs how many minutes they ran each day. Days are numbered starting at 1. The helper method <code>getMinutes(day)</code> is already written.",
  starter:`public class TrainingLog {
    /** Returns the minutes run on the given day.
     *  Precondition: day >= 1 */
    public int getMinutes(int day) { /* implementation not shown */ }

    /** (a) Returns the length of the longest run of consecutive days,
     *  from day 1 through numDays, on which minutes >= goal. */
    public int longestStreak(int goal, int numDays) { /* to be written */ }

    /** (b) Returns the first day of the 7-day stretch, within days
     *  1 through numDays, that has the greatest total minutes.
     *  Precondition: numDays >= 7 */
    public int bestWeekStart(int numDays) { /* to be written */ }
}`,
  example:"If minutes for days 1–8 are 30, 45, 50, 10, 40, 60, 55, 20, then longestStreak(40, 8) returns 3 (days 5, 6, 7).",
  solution:`public int longestStreak(int goal, int numDays) {
    int best = 0, current = 0;
    for (int d = 1; d <= numDays; d++) {
        if (getMinutes(d) >= goal) {
            current++;
            if (current > best) best = current;
        } else {
            current = 0;
        }
    }
    return best;
}

public int bestWeekStart(int numDays) {
    int bestStart = 1, bestTotal = -1;
    for (int start = 1; start + 6 <= numDays; start++) {
        int total = 0;
        for (int d = start; d < start + 7; d++) {
            total += getMinutes(d);
        }
        if (total > bestTotal) {
            bestTotal = total;
            bestStart = start;
        }
    }
    return bestStart;
}`,
  rubric:["(a) Loops over days 1 through numDays and calls getMinutes for each","(a) Compares each day's minutes to goal","(a) Counts the current streak and resets it to 0 when the streak breaks","(a) Keeps the longest streak and returns it","(b) Tries every valid start day (start + 6 ≤ numDays)","(b) Totals exactly 7 days for each start","(b) Tracks the best total and returns its start day"]},
 {t:"LockerCode",type:"Class design",units:"Units 1–3",
  prompt:"Write the complete <code>LockerCode</code> class. A locker has a secret code made of digits and allows a limited number of wrong tries.",
  starter:`LockerCode lock = new LockerCode("4271", 2);
lock.matches("4171");   // returns 3 (positions 0, 2, 3 match)
lock.tryCode("1111");   // returns "WRONG"  (1 try left)
lock.tryCode("4271");   // returns "OPEN"   (correct guesses don't use a try)
lock.tryCode("0000");   // returns "WRONG"  (0 tries left)
lock.tryCode("4271");   // returns "LOCKED" (no tries left)`,
  example:"The constructor takes the code and the maximum number of wrong tries. matches(guess) returns how many positions in guess match the code; guess is the same length as the code. tryCode(guess) returns \"LOCKED\" when no tries are left, \"OPEN\" when guess equals the code, and otherwise uses up one try and returns \"WRONG\".",
  solution:`public class LockerCode {
    private String code;
    private int triesLeft;

    public LockerCode(String c, int maxTries) {
        code = c;
        triesLeft = maxTries;
    }

    public String tryCode(String guess) {
        if (triesLeft == 0) return "LOCKED";
        if (guess.equals(code)) return "OPEN";
        triesLeft--;
        return "WRONG";
    }

    public int matches(String guess) {
        int count = 0;
        for (int i = 0; i < code.length(); i++) {
            if (guess.substring(i, i + 1).equals(code.substring(i, i + 1))) {
                count++;
            }
        }
        return count;
    }
}`,
  rubric:["Declares private instance variables for the code and the tries left","Constructor initializes both variables from its parameters","tryCode returns \"LOCKED\" before doing anything else when no tries are left","tryCode compares Strings with equals, not ==","tryCode uses up a try and returns \"WRONG\" only for a wrong guess","matches compares each position with substring and equals","matches returns the count"]},
 {t:"Playlist",type:"Data analysis with ArrayList",units:"Unit 4",
  prompt:"A <code>Playlist</code> stores <code>Song</code> objects in an ArrayList. A Song has <code>getTitle()</code>, <code>getArtist()</code>, and <code>getSeconds()</code>.",
  starter:`public class Playlist {
    private ArrayList<Song> songs;

    /** (a) Returns the total length, in minutes, of all songs by the
     *  given artist. Returns 0.0 if there are none. */
    public double totalMinutesBy(String artist) { /* to be written */ }

    /** (b) Removes every song shorter than the given number of seconds.
     *  Returns the removed songs' titles, in their original order. */
    public ArrayList<String> removeShorterThan(int seconds) { /* to be written */ }
}`,
  example:"If songs has lengths 200, 95, 240, 80 (seconds), removeShorterThan(100) removes the 2nd and 4th songs and returns their titles in that order.",
  solution:`public double totalMinutesBy(String artist) {
    int total = 0;
    for (Song s : songs) {
        if (s.getArtist().equals(artist)) {
            total += s.getSeconds();
        }
    }
    return total / 60.0;
}

public ArrayList<String> removeShorterThan(int seconds) {
    ArrayList<String> removed = new ArrayList<String>();
    int i = 0;
    while (i < songs.size()) {
        if (songs.get(i).getSeconds() < seconds) {
            removed.add(songs.remove(i).getTitle());
        } else {
            i++;
        }
    }
    return removed;
}`,

public boolean seatPair(int id1, int id2) {

secs:[
{h:"Algorithms come before code",p:"<p>An algorithm is a plan: a list of steps in a definite order. Before writing Java, write the steps in plain language. If the plan is wrong, the code will be wrong too, no matter how carefully it is typed.</p><p>The example below shows an algorithm for finding a class average, written first as steps and then as Java.</p>",
code:`// Algorithm (plain language)
// 1. Set total to 0.
// 2. Add each of the three scores to total.
// 3. Divide total by 3.0 to get the average.
// 4. Print the average.

int total = 0;
total = total + 88;
total = total + 92;
total = total + 75;
double average = total / 3.0;
System.out.println(average);   // 85.0`,
logic:["Each Java line matches one step of the plan, in the same order. That is sequencing.","Dividing by <code>3.0</code> instead of <code>3</code> keeps the decimal part (more on this in 1.3).","If the steps were in a different order (for example, printing before adding), the output would change. Order matters."]},
{h:"From source code to a running program",p:"<p>You write <strong>source code</strong> in a <code>.java</code> file. The <strong>compiler</strong> (<code>javac</code>) checks it and translates it into <strong>bytecode</strong> (a <code>.class</code> file). The <strong>Java Virtual Machine (JVM)</strong> runs the bytecode. An IDE such as VS Code, IntelliJ, or replit does all of this with one Run button.</p>",
code:`public class Greeting {                 // file must be named Greeting.java
    public static void main(String[] args) {   // the program starts here
        System.out.println("Welcome to AP CSA!");
    }
}`,
logic:["The class name must match the file name.","Every program starts running at the first line inside <code>main</code>.","If the compiler finds a syntax error, no bytecode is made and the program can't run until it is fixed."]},
{h:"Three kinds of errors",p:"<p><strong>Syntax errors</strong> are caught by the compiler: missing semicolons, unmatched braces, misspelled keywords. <strong>Run-time errors</strong> happen while the program runs; Java reports most of them as <strong>exceptions</strong> (for example <code>ArithmeticException</code> when an int is divided by 0). <strong>Logic errors</strong> give the wrong answer without any message, so you only find them by testing.</p>",
code:`int count = 5          // SYNTAX error: missing ;  (won't compile)

int a = 10, b = 0;
System.out.println(a / b);   // RUN-TIME error: ArithmeticException

double avg = 88 + 92 / 2;    // LOGIC error: gives 134.0, not 90.0
// fix: double avg = (88 + 92) / 2.0;`,
logic:["The compiler can't know that <code>b</code> will be 0 when the program runs, so the division error appears only at run time.","<code>92 / 2</code> runs first because of operator precedence, so the formula is wrong even though Java is happy with it.","To find logic errors, pick test data where you already know the correct answer and compare."]}],
mistakes:["Thinking \"it compiled\" means \"it works\". Compiling only rules out syntax errors.","Confusing run-time and logic errors: a run-time error stops the program; a logic error lets it finish with a wrong result.","Naming the file differently from the public class."],
tip:"Multiple-choice questions often show code and ask which kind of error it has. Ask yourself: would the compiler reject it (syntax), would it crash while running (run-time/exception), or would it run and give the wrong answer (logic)?"};

NOTES["1.2"]={
lo:[["1.2.A","Choose the most appropriate category of data type for a given need.",[["1.2.A.1","A data type is a set of values together with the operations allowed on them. Data types are either primitive or reference types."],["1.2.A.2","The primitive types in this course represent numbers and true/false (Boolean) values."],["1.2.A.3","A reference type is used for objects, which are anything that is not a primitive."]]],
["1.2.B","Write code that declares variables for numbers and Boolean values.",[["1.2.B.1","The course uses three primitive types: int (whole numbers), double (real numbers), and boolean (true or false)."],["EXCL","long, short, byte, float, and char are not part of the course or exam."],["1.2.B.2","A variable is a named storage location whose value can change while the program runs. Every variable has a name and a type, and a primitive variable holds a value of its primitive type."]]]],
secs:[
{h:"Declaring variables",p:"<p>A declaration gives a variable a <strong>type</strong> and a <strong>name</strong>. You can give it a starting value on the same line. Java is strongly typed: once a variable is declared as <code>int</code>, it can only hold int values.</p>",
code:`int lapCount;            // declaration only
lapCount = 12;           // assignment
double milesPerLap = 0.25;
boolean finished = false;

double totalMiles = lapCount * milesPerLap;   // 3.0`,
logic:["<code>lapCount</code> is declared, then assigned. You can't use it before it has a value.","<code>lapCount * milesPerLap</code> mixes an int and a double, so the result is a double.","<code>finished</code> can only ever be <code>true</code> or <code>false</code>."]},
{h:"Primitive vs. reference",p:"<p>A <strong>primitive</strong> variable stores the value itself. A <strong>reference</strong> variable stores the location (address) of an object. <code>String</code>, <code>Scanner</code>, arrays, and every class you write are reference types.</p>",
code:`int age = 16;                 // the box holds 16
String name = "Priya";        // the box holds a reference to a String object

// Naming rules: start with a letter, no spaces, case-sensitive.
// Convention: camelCase for variables -> studentCount, isReady`,
logic:["Picture <code>age</code> as a box with 16 inside.","Picture <code>name</code> as a box holding an arrow that points to the String object somewhere else in memory.","This difference matters later when we compare objects (2.6) and pass them to methods (3.6)."]},
{h:"Choosing the right type",p:"<p>Choose by asking what values are possible and what you will do with them.</p><ul><li>Counts and positions → <code>int</code></li><li>Measurements, money, averages → <code>double</code></li><li>Yes/no conditions → <code>boolean</code></li><li>Text → <code>String</code> (reference)</li></ul>",
code:`int studentsPresent = 27;
double averageScore = 88.4;
boolean hasPermissionSlip = true;
String teacher = "Ms. Rani Sangupillai";`,
logic:["A count can't be 27.5, so int is right.","An average can have decimals, so double is right.","A permission slip is either on file or not: boolean."]}],
mistakes:["Storing a decimal in an int: <code>int x = 3.5;</code> does not compile.","Writing <code>boolean b = \"true\";</code> (a String is not a boolean).","Using a variable before giving it a value."],
tip:"On the exam, \"which type is most appropriate\" questions reward thinking about every possible value, not just the example value given."};

NOTES["1.3"]={
lo:[["1.3.A","Write code that produces output and determine what is displayed.",[["1.3.A.1","System.out.println prints and then moves to a new line; System.out.print prints and stays on the same line."]]],
["1.3.B","Use string literals and determine the result.",[["1.3.B.1","A literal is a fixed value written directly in the code."],["1.3.B.2","A string literal is text inside double quotes."],["1.3.B.3","An escape sequence starts with a backslash. The course uses \\\" (double quote), \\\\ (backslash), and \\n (new line)."]]],
["1.3.C","Write arithmetic expressions and determine their values.",[["1.3.C.1","Arithmetic expressions combine numbers, variables, and operators, and evaluate to an int or a double."],["1.3.C.2","The operators are +, −, *, /, and %. Two int operands give an int; if a double is involved, the result is a double."],["EXCL","Expressions that produce special double values such as infinity or NaN are not tested."],["1.3.C.3","Dividing two ints keeps only the whole-number part. If at least one operand is a double, the full quotient is kept."],["1.3.C.4","The % operator gives the remainder after division."],["EXCL","Negative dividends and zero or negative divisors with % are not tested."],["1.3.C.5","*, /, and % are evaluated before + and −. Operators with the same precedence go left to right. Parentheses change the order."],["1.3.C.6","Dividing an int by the int 0 throws an ArithmeticException."],["EXCL","Dividing by zero when a double is involved is not tested."]]]],
secs:[
{h:"print vs. println and escape sequences",p:"<p><code>println</code> ends the line after printing; <code>print</code> does not. Inside a string literal, a backslash starts an escape sequence for characters you can't type directly.</p>",
code:`System.out.print("Code");
System.out.print("Club");
System.out.println("!");
System.out.println("She said \\"Hi\\"");
System.out.println("C:\\\\Users\\\\rani");
System.out.println("Line 1\\nLine 2");

// Output:
// CodeClub!
// She said "Hi"
// C:\\Users\\rani
// Line 1
// Line 2`,
logic:["The first two <code>print</code> calls stay on one line; <code>println(\"!\")</code> finishes it.","<code>\\\"</code> prints a quote mark without ending the string.","<code>\\\\</code> prints one backslash; <code>\\n</code> starts a new line in the middle of the string."]},
{h:"Integer division and remainder",p:"<p>This is the most tested idea in Unit 1. When both operands are ints, <code>/</code> drops the decimal part (it truncates; it does not round). <code>%</code> gives what is left over.</p>",
code:`System.out.println(17 / 5);     // 3
System.out.println(17 % 5);     // 2
System.out.println(17.0 / 5);   // 3.4
System.out.println(4 / 5);      // 0
System.out.println(4 % 5);      // 4

int minutes = 135;
int hours = minutes / 60;       // 2
int leftover = minutes % 60;    // 15`,
logic:["17 ÷ 5 = 3 remainder 2, so <code>17 / 5</code> is 3 and <code>17 % 5</code> is 2.","When the left number is smaller (4 % 5), the remainder is the left number itself.","<code>/ 60</code> and <code>% 60</code> together split minutes into hours and minutes. The same idea extracts digits with <code>/ 10</code> and <code>% 10</code>."]},
{h:"Order of operations",p:"<p>Evaluate <code>*</code>, <code>/</code>, <code>%</code> left to right first, then <code>+</code> and <code>−</code> left to right. Parentheses go first of all.</p>",
code:`int r = 2 + 3 * 4 - 10 / 4 % 3;
// 3 * 4 = 12
// 10 / 4 = 2
// 2 % 3 = 2
// 2 + 12 - 2 = 12
System.out.println(r);          // 12

System.out.println((2 + 3) * 4); // 20`,
logic:["Find every *, /, % and do them left to right: 12, then 2, then 2 % 3 = 2.","Then do + and − left to right: 2 + 12 = 14, 14 − 2 = 12.","Writing each step on scratch paper like this avoids most mistakes on trace questions."]}],
mistakes:["Expecting <code>7 / 2</code> to be 3.5. It is 3.","Thinking int division rounds: <code>9 / 5</code> is 1, not 2.","Doing + before * because it appears first."],
tip:"For any expression, label each operand int or double before evaluating. The type of the result changes the answer more often than the arithmetic does."};

NOTES["1.4"]={
lo:[["1.4.A","Write assignment statements and determine the value stored.",[["1.4.A.1","A variable must be given a compatible value before it is used. The first assignment initializes it. A reference variable can be assigned a new object or null (no object)."],["1.4.A.2","The = operator evaluates the right side and stores the result in the variable on the left, replacing any old value."],["EXCL","Using an assignment inside a larger expression is not tested."],["1.4.A.3","Every expression evaluates to exactly one value, and that value has a type."]]],
["1.4.B","Write code that reads input.",[["1.4.B.1","Input can come in many forms; the Scanner class is one way to read what the user types on the keyboard."],["EXCL","Other specific ways of getting user input are not tested."]]]],
secs:[
{h:"How assignment works",p:"<p>Read <code>=</code> as \"gets\", not \"equals\". Java always evaluates the entire right side first, using the current values, and then stores the result on the left.</p>",
code:`int score = 10;
score = score + 5;       // right side: 10 + 5 = 15, then store
int bonus = score;       // bonus gets a COPY of 15
score = 0;
System.out.println(bonus);   // 15`,
logic:["<code>score = score + 5</code> is not a math equation. It means: take the current score, add 5, store it back.","<code>bonus = score</code> copies the value 15. They are separate boxes afterward.","Changing <code>score</code> later doesn't touch <code>bonus</code>."]},
{h:"Tracing with a table",p:"<p>For trace questions, make a table with one column per variable and update it line by line.</p>",
code:`int a = 4;
int b = 7;
a = b - a;     // a = 3
b = a * 2;     // b = 6
a = a + b;     // a = 9`,
logic:["Line 3 uses the old <code>a</code> (4): 7 − 4 = 3.","Line 4 uses the new <code>a</code> (3): 3 × 2 = 6.","Final values: a = 9, b = 6. Cross out old values in the table instead of erasing them."]},
{h:"Reading keyboard input with Scanner",p:"<p><code>Scanner</code> is in <code>java.util</code>. Create one connected to <code>System.in</code>, then call the method that matches the type you expect.</p>",
code:`import java.util.Scanner;

public class Tip {
    public static void main(String[] args) {
        Scanner in = new Scanner(System.in);
        System.out.print("Bill amount: ");
        double bill = in.nextDouble();
        System.out.print("Tip percent: ");
        int pct = in.nextInt();
        double tip = bill * pct / 100;
        System.out.println("Tip: " + tip);
    }
}`,
logic:["<code>nextDouble()</code> reads a decimal number; <code>nextInt()</code> reads a whole number; <code>nextLine()</code> reads a whole line of text.","If the user types text when <code>nextInt()</code> expects a number, the program throws an exception.","<code>bill * pct</code> is a double, so dividing by 100 keeps the decimal."]}],
mistakes:["Reading <code>x = y</code> as \"x equals y\" and expecting both to change later.","Using a local variable before it has a value (compile error).","Writing the assignment backward: <code>5 = x;</code> does not compile."],
tip:"Trace questions with several assignments are easy points if you keep a table. Never do them in your head."};

NOTES["1.5"]={
lo:[["1.5.A","Write expressions that cast primitive values and determine the result.",[["1.5.A.1","The casting operators (int) and (double) convert between int and double values."],["1.5.A.2","Casting a double to an int truncates: the digits after the decimal point are dropped."],["1.5.A.3","Some int values are widened to double automatically when needed."],["1.5.A.4","To round a double to the nearest int, use (int)(x + 0.5) when x is not negative and (int)(x − 0.5) when x is negative."]]],
["1.5.B","Explain when an integer expression goes out of range.",[["1.5.B.1","Integer.MAX_VALUE and Integer.MIN_VALUE hold the largest and smallest int values."],["1.5.B.2","An int uses 4 bytes of memory, so its value must stay between those two limits."],["1.5.B.3","If an int result goes past the limit, integer overflow happens: the result wraps around to an int in range, usually not the one expected."]]],
["1.5.C","Explain what limits the accuracy of an expression.",[["1.5.C.1","Memory is limited, so a double may be stored as the closest value it can represent (round-off error). Using int values avoids this."],["EXCL","Special decimal types that avoid round-off are not tested."]]]],
secs:[
{h:"Casting between int and double",p:"<p>A cast is written as a type in parentheses in front of a value. It applies only to the value right after it, so parentheses decide what gets cast.</p>",
code:`double price = 7.89;
int dollars = (int) price;            // 7  (truncated)

int total = 17, count = 5;
double avg1 = total / count;          // 3.0  (int division first!)
double avg2 = (double) total / count; // 3.4
double avg3 = (double) (total / count); // 3.0`,
logic:["<code>(int) 7.89</code> chops off .89 → 7. It never rounds up.","In <code>avg2</code>, total is cast first, so the division is double ÷ int = 3.4.","In <code>avg3</code>, the parentheses make the int division happen first (3), and then 3 becomes 3.0. Too late to save the decimal."]},
{h:"Rounding",p:"<p>Java has no rounding in the course subset except this trick: shift by 0.5, then truncate.</p>",
code:`double a = 6.5, b = 6.49, c = -2.7;
int ra = (int) (a + 0.5);   // 7
int rb = (int) (b + 0.5);   // 6
int rc = (int) (c - 0.5);   // -3`,
logic:["6.5 + 0.5 = 7.0 → 7.","6.49 + 0.5 = 6.99 → 6.","For a negative value subtract 0.5: −2.7 − 0.5 = −3.2 → −3."]},
{h:"Overflow and round-off",p:"<p>An int can hold values from −2,147,483,648 to 2,147,483,647. Going past the top wraps around to the bottom. Doubles have a different problem: many decimals can't be stored exactly.</p>",
code:`int big = Integer.MAX_VALUE;   // 2147483647
big = big + 1;
System.out.println(big);       // -2147483648 (overflow)

double x = 0.1 + 0.2;
System.out.println(x);         // 0.30000000000000004
System.out.println(x == 0.3);  // false`,
logic:["Java doesn't throw an error on overflow; it quietly gives a wrong value.","0.1 and 0.2 can't be stored exactly in binary, so their sum is very slightly off.","That's why money is often stored in cents as an int."]}],
mistakes:["Thinking <code>(int)</code> rounds.","Casting after the integer division has already happened.","Comparing doubles with <code>==</code> and expecting exact results."],
tip:"When you see a cast, draw parentheses around exactly what it applies to. Most wrong answers come from casting the wrong part."};

NOTES["1.6"]={
lo:[["1.6.A","Write assignments with compound operators and determine the value stored.",[["1.6.A.1","The compound operators +=, −=, *=, /=, and %= can replace a normal assignment in numeric expressions. They apply the operation to the variable and the right side, then store the result in the variable."],["1.6.A.2","The post-increment ++ adds 1 to a numeric variable and the post-decrement −− subtracts 1, storing the new value."],["EXCL","Prefix forms (++x) and using ++ or −− inside other expressions (such as arr[x++]) are not tested."]]]],
secs:[
{h:"Compound assignment",p:"<p><code>x op= expr</code> means <code>x = x op (expr)</code>. The whole right side is evaluated first.</p>",
code:`int points = 20;
points += 5;      // 25
points -= 3;      // 22
points *= 2;      // 44
points /= 5;      // 8   (int division)
points %= 3;      // 2

int y = 3;
y *= 2 + 1;       // y = 3 * (2 + 1) = 9, not 7`,
logic:["Each line uses the value left by the line before it.","<code>/=</code> on an int still does integer division: 44 / 5 = 8.","In <code>y *= 2 + 1</code> the right side (3) is computed first, then multiplied."]},
{h:"Increment and decrement",p:"<p><code>count++</code> is the same as <code>count += 1</code>. On the AP exam it appears only as its own statement, often in loops.</p>",
code:`int lives = 3;
lives--;          // 2
lives--;          // 1
lives++;          // 2

int steps = 0;
for (int i = 0; i < 4; i++) {
    steps += 10;
}
// steps is 40`,
logic:["Each <code>--</code> subtracts exactly one.","<code>i++</code> in the loop header is the update step (2.8).","<code>steps += 10</code> runs once per pass: 4 passes × 10 = 40."]}],
mistakes:["Writing <code>=+</code> instead of <code>+=</code>. <code>x =+ 5</code> just sets x to 5.","Forgetting that <code>x *= a + b</code> multiplies by the whole sum.","Forgetting that <code>/=</code> on an int truncates."],
tip:"Rewrite every compound statement in long form (x = x * (…)) before evaluating it."};

NOTES["1.7"]={
lo:[["1.7.A","Identify the attributes and behaviors of a class found in an API's libraries.",[["1.7.A.1","Libraries are collections of classes. An API specification explains how to use them, and documentation is how programmers learn a class's attributes and behaviors. Classes are grouped into packages and can be used to create objects."],["1.7.A.2","Attributes are the data related to a class, stored in variables. Behaviors are what instances of the class can do, defined by methods."]]]],
secs:[
{h:"Libraries, packages, and imports",p:"<p>Java comes with thousands of ready-made classes. They are organized into <strong>packages</strong>. Classes in <code>java.lang</code> (String, Math, Integer, Double, Object) are available automatically; others must be imported.</p>",
code:`import java.util.Scanner;     // keyboard/file input
import java.util.ArrayList;   // resizable lists (Unit 4)
import java.io.File;          // files (Unit 4)

// No import needed:
String s = "hello";
double r = Math.sqrt(49);`,
logic:["<code>import</code> lines go at the top of the file, before the class.","The part before the last dot is the package; the last part is the class.","Forgetting an import gives a compile error such as \"cannot find symbol\"."]},
{h:"Reading an API",p:"<p>Documentation lists each method's <strong>return type</strong>, <strong>name</strong>, and <strong>parameters</strong>, plus a description. The AP exam gives you the Java Quick Reference, which is a short API for the classes on the test.</p>",
code:`// From the String API (Java Quick Reference):
// int length()                   returns the number of characters
// String substring(int from, int to)
// int indexOf(String str)

String club = "Robotics";
int n = club.length();             // 8
String part = club.substring(0, 4); // "Robo"`,
logic:["<code>int length()</code> tells you: call it with no arguments, and it gives back an int.","<code>substring(int, int)</code> needs two ints and gives back a String.","You can use these methods correctly without ever seeing how String is written. That is abstraction."]},
{h:"Attributes and behaviors",p:"<p>Think of a class in terms of what it <strong>has</strong> (attributes) and what it <strong>does</strong> (behaviors).</p>",
code:`// A class diagram for a phone, in plain language
// Phone
//   attributes: batteryPercent, model, isOn
//   behaviors:  call(number), charge(minutes), powerOff()`,
logic:["Attributes are nouns: data stored in variables.","Behaviors are verbs: actions written as methods.","You will write classes like this yourself in Unit 3."]}],
mistakes:["Importing <code>java.lang.String</code> (harmless but unnecessary) and then forgetting <code>java.util</code> imports that are required.","Calling a method with the wrong number or type of arguments because the API wasn't checked.","Mixing up attributes (data) and behaviors (methods)."],
tip:"Get to know the Java Quick Reference before exam day. It shows which String, Math, Integer, Double, ArrayList, File, and Scanner methods you may use."};

NOTES["1.8"]={
lo:[["1.8.A","Write comments that describe what code does.",[["1.8.A.1","Comments help the programmer and others understand code. The compiler ignores them. Java has block comments /* */, single-line comments //, and Javadoc comments /** */, which are used to generate API documentation."],["1.8.A.2","A precondition is a condition that must be true just before a method runs for it to work as expected."],["EXCL","Methods are not expected to check their own preconditions."],["1.8.A.3","A postcondition is a condition that must always be true after a method runs. It describes the result in terms of the return value or the object's attribute values."]]]],
secs:[
{h:"Three kinds of comments",p:"<p>Good comments explain <em>why</em> and <em>what</em>, not every keystroke. Javadoc comments sit right above a method or class.</p>",
code:`/* Block comment:
   can span several lines */

// Single-line comment

/**
 * Returns the number of full boxes needed to pack the items.
 * @param items number of items to pack
 * @param perBox how many items fit in one box
 * @return number of boxes
 */
public static int boxes(int items, int perBox) {
    return (items + perBox - 1) / perBox;   // rounds up
}`,
logic:["The Javadoc describes what the method does, its parameters, and what it returns.","The inline comment explains a trick that isn't obvious: adding perBox − 1 before dividing rounds up.","None of these lines are run."]},
{h:"Preconditions and postconditions",p:"<p>A precondition is a promise the <strong>caller</strong> makes. A postcondition is a promise the <strong>method</strong> makes. FRQs often state preconditions; you can assume they are true and should not write code to check them.</p>",
code:`/**
 * Precondition: perBox > 0 and items >= 0
 * Postcondition: returns the smallest number of boxes b
 *                such that b * perBox >= items
 */
public static int boxes(int items, int perBox) { ... }

boxes(10, 3);   // 4
boxes(10, 0);   // breaks the precondition -> ArithmeticException`,
logic:["With perBox = 3 and 10 items, 4 boxes are needed.","Calling with 0 breaks the precondition. The resulting crash is the caller's fault.","On FRQs, using a precondition (for example \"the list is not empty\") lets you skip special cases."]}],
mistakes:["Writing extra code in an FRQ to check a precondition the question already guarantees.","Thinking comments are run or affect output.","Mixing up which side (caller or method) is responsible for which condition."],
tip:"Read every precondition in an FRQ carefully. It often tells you something that makes the solution simpler, such as an array having at least one element."};

NOTES["1.9"]={
lo:[["1.9.A","Identify the correct method to call based on its documentation.",[["1.9.A.1","A method is a named block of code that runs only when called. Procedural abstraction lets you use a method knowing what it does, without knowing how."],["1.9.A.2","Parameters are variables declared in the method header. A method signature is the method name followed by the ordered list of parameter types."]]],
["1.9.B","Describe how to call methods.",[["1.9.B.1","A void method does not return a value, so it can't be used in an expression."],["1.9.B.2","A non-void method returns one value of its return type. That value should be stored or used in an expression."],["1.9.B.3","Arguments are the values passed in a call. They must match the parameters in number and order, and the parameters receive copies of their values (call by value)."],["1.9.B.4","Overloaded methods have the same name but different signatures."],["1.9.B.5","A method call pauses the current code, runs the method, and then continues right after the call when the method finishes or reaches a return."]]]],
secs:[
{h:"Reading a method header",p:"<p>A header tells you everything needed to call the method.</p>",
code:`public static double average(int a, int b, int c)
//  access  class  return   name     parameters
//          method  type

// Signature: average(int, int, int)`,
logic:["<code>double</code> is the return type: the call produces a double.","The signature is only the name plus the parameter types in order. The return type and parameter names are not part of it.","To call it you need exactly three int arguments."]},
{h:"void vs. non-void, and flow of control",p:"<p>A void method does something (like printing). A non-void method computes something and hands it back. When a method is called, Java jumps into it, runs it, then comes back.</p>",
code:`public static void banner(String msg) {
    System.out.println("*** " + msg + " ***");
}
public static int square(int n) {
    return n * n;
}

// in main:
System.out.println("start");
banner("Unit 1");            // statement by itself
int s = square(5) + 1;       // 26: value used in an expression
System.out.println(s);
// Output: start / *** Unit 1 *** / 26`,
logic:["<code>banner</code> returns nothing, so <code>int x = banner(\"x\");</code> would not compile.","<code>square(5)</code> becomes the value 25 right where it was called.","Execution goes main → banner → back to main → square → back to main."]},
{h:"Overloading",p:"<p>Java chooses which overloaded method to run by matching the arguments to a signature.</p>",
code:`public static int area(int side) { return side * side; }
public static int area(int w, int h) { return w * h; }
public static double area(double r) { return 3.14159 * r * r; }

area(4);      // calls area(int)        -> 16
area(4, 5);   // calls area(int, int)   -> 20
area(2.0);    // calls area(double)     -> 12.56636`,
logic:["Different number or types of parameters make the signatures different.","Two methods that differ only in return type are not allowed.","Arguments are matched in order: area(int, double) would be a different signature from area(double, int)."]}],
mistakes:["Using a void method's \"result\" in an expression.","Ignoring a non-void method's return value when you needed it.","Passing arguments in the wrong order (for example, swapping width and height)."],
tip:"For \"which call is valid\" questions, check three things in order: number of arguments, type of each argument, and what the return type is assigned to."};

NOTES["1.10"]={
lo:[["1.10.A","Write expressions that call class methods and determine the result.",[["1.10.A.1","Class methods belong to the class, not to any one object. Their headers include the keyword static."],["1.10.A.2","Call a class method with the class name, a dot, and the method name. Inside the class that defines it, the class name may be left out."]]]],
secs:[
{h:"Calling static methods",p:"<p>You don't need an object to call a static method. <code>Math.sqrt</code> and <code>Integer.parseInt</code> are examples from the Java library.</p>",
code:`public class Temperature {
    public static double toCelsius(double f) {
        return (f - 32) * 5 / 9;
    }
    public static void main(String[] args) {
        double c1 = toCelsius(212);              // same class: name optional
        double c2 = Temperature.toCelsius(32);   // with class name
        System.out.println(c1 + " " + c2);       // 100.0 0.0
    }
}`,
logic:["Inside Temperature, <code>toCelsius(212)</code> works without the class name.","From another class you must write <code>Temperature.toCelsius(...)</code>.","(212 − 32) × 5 / 9 = 180 × 5 / 9 = 100.0."]},
{h:"Nesting calls",p:"<p>The return value of one call can be the argument of another. Evaluate the innermost call first.</p>",
code:`public static int doubleIt(int n) { return n * 2; }
public static int addTen(int n) { return n + 10; }

int r = addTen(doubleIt(addTen(1)));
// addTen(1)    -> 11
// doubleIt(11) -> 22
// addTen(22)   -> 32`,
logic:["Work from the inside out.","Each call's result replaces the call in the expression.","r is 32."]}],
mistakes:["Trying to call a static method on a class that doesn't define it.","Forgetting the class name when calling from a different class.","Evaluating nested calls from the outside in."],
tip:"FRQ part (b) often asks you to call the method you wrote in part (a). Call it even if you think your part (a) is wrong; you won't lose points twice."};

NOTES["1.11"]={
lo:[["1.11.A","Write expressions using Math class methods and determine the result.",[["1.11.A.1","Math is in java.lang, so it is available without an import."],["1.11.A.2","Math has only class (static) methods. The ones in this course are abs (int and double versions), pow, sqrt, and random, as shown in the Java Quick Reference."],["1.11.A.3","Values from Math.random() can be scaled, shifted, and cast to get random ints or doubles in a chosen range."]]]],
secs:[
{h:"Math methods",p:"<table><tr><th>Call</th><th>Returns</th></tr><tr><td><code>Math.abs(int x)</code></td><td>int, |x|</td></tr><tr><td><code>Math.abs(double x)</code></td><td>double, |x|</td></tr><tr><td><code>Math.pow(double b, double e)</code></td><td>double, b<sup>e</sup></td></tr><tr><td><code>Math.sqrt(double x)</code></td><td>double, √x</td></tr><tr><td><code>Math.random()</code></td><td>double, 0.0 ≤ r &lt; 1.0</td></tr></table>",
code:`double hyp = Math.sqrt(Math.pow(6, 2) + Math.pow(8, 2));  // 10.0
int gap = Math.abs(3 - 11);                              // 8
double cube = Math.pow(2, 3);                            // 8.0
int c = (int) Math.pow(2, 3);                            // 8`,
logic:["pow and sqrt always return doubles, even with int arguments.","To store pow's result in an int, cast it.","abs keeps the type of its argument."]},
{h:"Random integers in a range",p:"<p>Recipe for a random int from <code>min</code> to <code>max</code>, inclusive: <code>(int) (Math.random() * (max - min + 1)) + min</code>.</p>",
code:`// Die roll: 1 to 6
int die = (int) (Math.random() * 6) + 1;

// Random from 10 to 20 inclusive (11 values)
int n = (int) (Math.random() * 11) + 10;

// 30% chance
if (Math.random() < 0.3) {
    System.out.println("Rare drop!");
}`,
logic:["Math.random() * 6 is 0.0 up to (not including) 6.0.","Casting gives 0–5; adding 1 gives 1–6.","<code>Math.random() &lt; 0.3</code> is true about 30% of the time. 2024 FRQ 1 used this idea."]}],
mistakes:["Casting too early: <code>(int) Math.random() * 6</code> is always 0.","Using max − min instead of max − min + 1 values.","Storing <code>Math.pow</code> in an int without a cast."],
tip:"Check a random range by plugging in the smallest (0.0) and largest (almost 1.0) possible values of Math.random()."};

NOTES["1.12"]={
lo:[["1.12.A","Explain the relationship between a class and an object.",[["1.12.A.1","An object is a specific instance of a class with its own attribute values. A class is the blueprint that defines the attributes and behaviors."],["1.12.A.2","A superclass and its subclasses share attributes and behaviors through inheritance."],["EXCL","Designing and writing your own inheritance relationships is not tested."],["1.12.A.3","Every Java class is a subclass of the Object class."]]],
["1.12.B","Declare variables of the correct type to hold object references.",[["1.12.B.1","A reference variable holds an object reference, which can be thought of as the object's memory address."]]]],
secs:[
{h:"Class vs. object",p:"<p>A class is like a cookie cutter; objects are the cookies. One class can make many objects, and each has its own data.</p>",
code:`// One class, two objects
String a = new String("Wayne");
String b = new String("Paterson");

System.out.println(a.length());   // 5
System.out.println(b.length());   // 8`,
logic:["Both objects come from the String class and have the same behaviors.","Each has its own state (its characters), so <code>length()</code> gives different answers.","<code>a</code> and <code>b</code> are reference variables that point to the two objects."]},
{h:"Inheritance (reading only)",p:"<p>A subclass <em>is-a</em> kind of its superclass and gets its methods. In this course you only need to recognize the relationship, not write it.</p>",
code:`// Object
//   └── Animal          (superclass)
//         ├── Dog        (subclass: Dog is-an Animal)
//         └── Cat
// Every class, including String, ultimately extends Object.`,
logic:["Dog and Cat get Animal's attributes and behaviors.","Every class has methods like toString and equals because it inherits them from Object.","Writing <code>extends</code> yourself is out of scope for the revised exam."]}],
mistakes:["Saying a class \"is\" an object. A class describes objects.","Thinking a reference variable holds the object itself.","Thinking subclass objects can't have their own extra methods."],
tip:"If a question says \"instance\", read it as \"object\"."};

NOTES["1.13"]={
lo:[["1.13.A","Identify which constructor is called from its signature.",[["1.13.A.1","A constructor is used to create an object and has the same name as its class."],["1.13.A.2","A constructor signature is the class name followed by the ordered list of parameter types."],["1.13.A.3","Constructors can be overloaded: a class can have several with different signatures."]]],
["1.13.B","Declare variables of the correct type to hold object references.",[["1.13.B.1","A reference variable holds either a reference to an object or null."]]],
["1.13.C","Write code that creates objects by calling constructors.",[["1.13.C.1","An object is created with the keyword new followed by a constructor call."],["1.13.C.2","Constructor parameters are often used to give the new object's attributes their starting values."],["1.13.C.3","Arguments must match the constructor's parameters in number and order. Values are passed by copy (call by value)."],["1.13.C.4","Calling a constructor pauses the current code, runs the constructor, and then continues after the call."]]]],
secs:[
{h:"Creating objects",p:"<p><code>new</code> reserves memory for an object, runs the constructor to set it up, and returns a reference to it.</p>",
code:`// Suppose the Student class has these constructors:
//   Student()
//   Student(String name)
//   Student(String name, int grade)

Student s1 = new Student();
Student s2 = new Student("Aarav");
Student s3 = new Student("Mia", 11);
Student s4 = null;     // no object yet`,
logic:["Java picks the constructor whose parameter list matches the arguments.","<code>new Student(11, \"Mia\")</code> would not compile: the order is wrong.","s4 holds null, so calling a method on it would throw a NullPointerException (1.14)."]},
{h:"References and aliases",p:"<p>Assigning one reference variable to another copies the <strong>reference</strong>, not the object. Both variables then point to the same object.</p>",
code:`Student a = new Student("Leo", 10);
Student b = a;        // b is an alias for the same object
Student c = new Student("Leo", 10);   // a different object

// a == b  -> true   (same object)
// a == c  -> false  (different objects, even with the same data)`,
logic:["Only two objects exist here, because <code>new</code> appears twice.","Changes made through b are visible through a.","This aliasing idea returns in 2.6 and 3.6."]}],
mistakes:["Putting a return type on a constructor.","Expecting <code>b = a</code> to make a copy of the object.","Passing constructor arguments in the wrong order."],
tip:"Count the <code>new</code> keywords to count the objects created."};

NOTES["1.14"]={
lo:[["1.14.A","Write code that calls instance methods and determine the result.",[["1.14.A.1","Instance methods are called on an object with the dot operator: objectName.methodName(arguments)."],["1.14.A.2","Calling an instance method on a null reference throws a NullPointerException."]]]],
secs:[
{h:"Calling methods on objects",p:"<p>An instance method uses the data of the object it is called on, so the same call on different objects can give different results.</p>",
code:`String first = "Ada";
String last = "Lovelace";

int n1 = first.length();          // 3
int n2 = last.length();           // 8
String upper = last.toUpperCase(); // "LOVELACE"
System.out.println(last);         // still "Lovelace"`,
logic:["<code>first.length()</code> and <code>last.length()</code> run the same method on different objects.","toUpperCase returns a new String; the original is not changed (Strings are immutable).","To keep a result, store it in a variable."]},
{h:"NullPointerException",p:"<p>A reference that is <code>null</code> doesn't point to any object, so there is nothing to call the method on.</p>",
code:`String nickname = null;
// System.out.println(nickname.length());  // NullPointerException

if (nickname != null) {
    System.out.println(nickname.length());
} else {
    System.out.println("No nickname");
}`,
logic:["Checking for null first avoids the crash.","<code>!=</code> with null compares references, which is allowed.","Short-circuiting (2.5) makes <code>s != null &amp;&amp; s.length() > 0</code> safe."]}],
mistakes:["Calling an instance method with the class name (String.length()).","Forgetting the parentheses: <code>s.length</code> is wrong for Strings.","Expecting a String method to change the original String."],
tip:"In object-heavy FRQs, every call you write must be on an object of the right class. Check that the method exists in the class description given."};

NOTES["1.15"]={
lo:[["1.15.A","Write code that creates String objects and determine the result of combining them.",[["1.15.A.1","A String is a sequence of characters, created with a literal or with the String constructor."],["1.15.A.2","String is in java.lang, so no import is needed."],["1.15.A.3","Strings are immutable. Methods that seem to change a String actually return a new one."],["1.15.A.4","Strings are joined with + or +=. A primitive joined to a String is converted to text automatically."],["1.15.A.5","Joining any object to a String calls that object's toString method."],["EXCL","Overriding toString is not tested."]]],
["1.15.B","Call String methods and determine the result.",[["1.15.B.1","Valid indexes run from 0 to length() − 1. Using any other index throws an IndexOutOfBoundsException (StringIndexOutOfBoundsException)."],["1.15.B.2","The tested methods are length, substring(from, to), substring(from), indexOf, equals, and compareTo, as listed in the Java Quick Reference."],["EXCL","Using equals to compare a String with an object that isn't a String is not tested."],["1.15.B.3","substring(index, index + 1) gives the one-character String at that index."]]]],
secs:[
{h:"Indexes and substring",p:"<p>Characters are numbered from 0. <code>substring(a, b)</code> starts at a and stops <strong>before</strong> b, so its length is b − a.</p>",
code:`String s = "PASSAIC";
//          0123456

s.length();          // 7
s.substring(1, 4);   // "ASS"  (indexes 1, 2, 3)
s.substring(4);      // "AIC"  (index 4 to the end)
s.substring(2, 3);   // "S"    (one character)
s.substring(7);      // ""     (allowed: starts at length)
s.substring(0, 8);   // StringIndexOutOfBoundsException`,
logic:["Write the indexes under the letters when tracing.","Length of substring(1, 4) is 4 − 1 = 3 characters.","Starting exactly at length() gives an empty String; anything past it throws an exception."]},
{h:"indexOf, equals, compareTo",p:"<p><code>indexOf</code> returns the first position of a substring or −1 if it's not there. <code>equals</code> compares text. <code>compareTo</code> compares alphabetical (dictionary) order.</p>",
code:`String w = "banana";
w.indexOf("an");        // 1
w.indexOf("x");         // -1

String a = "apple", b = "Apple";
a.equals(b);            // false (case matters)
"cat".compareTo("dog"); // negative ("cat" comes first)
"dog".compareTo("cat"); // positive
"cat".compareTo("cat"); // 0`,
logic:["indexOf finds only the first match.","Use equals (never ==) to compare String contents.","compareTo &lt; 0 means the calling String comes first."]},
{h:"Concatenation",p:"<p><code>+</code> works left to right. Once a String appears, the rest is joined as text.</p>",
code:`int a = 3, b = 4;
System.out.println(a + b + " points");   // "7 points"
System.out.println("points " + a + b);   // "points 34"
System.out.println("points " + (a + b)); // "points 7"

String msg = "Go";
msg += "!";            // msg now refers to a new String "Go!"`,
logic:["In the first line, 3 + 4 is added before any String appears.","In the second line, \"points \" + 3 is text, so + 4 is joined as text.","Parentheses force the addition to happen first."]}],
mistakes:["Thinking substring's second index is included.","Comparing Strings with ==.","Expecting <code>s.toUpperCase();</code> on its own line to change s."],
tip:"Many FRQs (2023 Sign, 2025 SignedText, 2026 Account) are built on substring and indexOf. Practice tracing them with index numbers written out."};
NOTES["2.1"]={
lo:[["2.1.A","Describe everyday patterns and algorithms that use selection and repetition, in words or diagrams.",[["2.1.A.1","Algorithms are built from three structures: sequencing, selection, and repetition."],["2.1.A.2","Algorithms make decisions with selection and repeat steps with repetition (loops)."],["2.1.A.3","Selection chooses which path the algorithm takes based on a true or false decision."],["2.1.A.4","Repetition repeats a process until a desired outcome is reached."],["2.1.A.5","The order in which sequencing, selection, and repetition are used changes the result of the algorithm."]]]],
secs:[
{h:"The three building blocks",p:"<p><strong>Sequencing</strong>: do steps in order. <strong>Selection</strong>: choose a path with a yes/no question. <strong>Repetition</strong>: repeat steps while something is true. Every algorithm you will write combines these.</p>",
code:`// Algorithm: print the even numbers from 1 to 10
// 1. Set n to 1.                         (sequencing)
// 2. While n is at most 10:              (repetition)
//      If n is even, print n.            (selection)
//      Add 1 to n.
// 3. Print "done".

int n = 1;
while (n <= 10) {
    if (n % 2 == 0) {
        System.out.print(n + " ");
    }
    n++;
}
System.out.println("done");   // 2 4 6 8 10 done`,
logic:["The loop handles the repetition; the if inside handles the selection.","<code>n % 2 == 0</code> is the yes/no question.","Step 3 runs once, after the loop ends."]},
{h:"Order changes the outcome",p:"<p>Moving one step can change the whole result. Compare these two versions.</p>",
code:`// Version A                      // Version B
int n = 1;                        int n = 1;
while (n <= 3) {                  while (n <= 3) {
    n++;                              System.out.print(n);
    System.out.print(n);              n++;
}                                 }
// prints 234                     // prints 123`,
logic:["In A, n is increased before printing, so the first value printed is 2.","In B, n is printed first, so the output starts at 1.","Same steps, different order, different output."]}],
mistakes:["Putting a step inside the loop that should run once (or the reverse).","Updating a counter in the wrong place.","Writing code before the steps are clear."],
tip:"Before coding an FRQ, write 3–5 plain-language steps in the margin. It makes the selection and repetition parts obvious."};

NOTES["2.2"]={
lo:[["2.2.A","Write Boolean expressions with relational operators and determine their values.",[["2.2.A.1","== and != test whether two values are the same. Primitives are compared by value; reference types are compared by reference (whether they point to the same object)."],["2.2.A.2","<, >, <=, and >= compare numeric values."],["2.2.A.3","An expression with a relational operator evaluates to a boolean: true or false."]]]],
secs:[
{h:"Relational operators",p:"<table><tr><th>Operator</th><th>Meaning</th></tr><tr><td><code>==</code></td><td>equal to</td></tr><tr><td><code>!=</code></td><td>not equal to</td></tr><tr><td><code>&lt; &gt;</code></td><td>less than, greater than</td></tr><tr><td><code>&lt;= &gt;=</code></td><td>at most, at least</td></tr></table>",
code:`int score = 87;
boolean passed = score >= 70;     // true
boolean perfect = score == 100;   // false
boolean isOdd = score % 2 != 0;   // true

System.out.println(passed + " " + perfect);   // true false`,
logic:["Each comparison produces a boolean that can be stored.","<code>score % 2 != 0</code> is the standard odd-number test.","Don't confuse <code>=</code> (assign) with <code>==</code> (compare)."]},
{h:"Comparing objects",p:"<p>For objects, <code>==</code> asks \"are these the same object?\" Use <code>equals</code> to ask \"do these have the same contents?\"</p>",
code:`String s1 = new String("STEM");
String s2 = new String("STEM");
String s3 = s1;

s1 == s2;        // false (two different objects)
s1.equals(s2);   // true  (same text)
s1 == s3;        // true  (same object)`,
logic:["<code>new</code> was used twice, so s1 and s2 are different objects.","s3 is an alias of s1.","Rule: compare Strings and other objects with equals."]}],
mistakes:["Using = in a condition.","Comparing Strings with ==.","Comparing doubles with == after arithmetic (round-off, 1.5)."],
tip:"\"Determine the value\" questions with relational operators are quick points: evaluate the arithmetic first, then the comparison."};

NOTES["2.3"]={
lo:[["2.3.A","Write selection statements and determine the result of the branching logic.",[["2.3.A.1","Selection statements change the normal top-to-bottom order in which statements run."],["2.3.A.2","An if statement runs different code depending on whether a Boolean expression is true or false."],["2.3.A.3","A one-way selection (if) runs its body only when the condition is true."],["2.3.A.4","A two-way selection (if-else) runs the if body when the condition is true and the else body when it is false."]]]],
secs:[
{h:"One-way and two-way selection",p:"<p>Use <code>if</code> when something should happen only sometimes. Use <code>if-else</code> when exactly one of two things must happen.</p>",
code:`int battery = 15;

// one-way
if (battery < 20) {
    System.out.println("Low battery");
}

// two-way
if (battery >= 50) {
    System.out.println("Good to go");
} else {
    System.out.println("Plug in soon");
}
// Output: Low battery / Plug in soon`,
logic:["15 &lt; 20 is true, so the warning prints.","15 &gt;= 50 is false, so the else branch runs.","Exactly one branch of an if-else always runs."]},
{h:"Braces matter",p:"<p>Without braces, only the next single statement belongs to the if. Indentation does not change this.</p>",
code:`int x = 2;
if (x > 5)
    System.out.print("big ");
    System.out.print("number");   // NOT inside the if

// Output: number`,
logic:["Only the first print is controlled by the if.","The second print always runs.","Always use braces to avoid this trap."]},
{h:"Selection in a method",p:"<p>Selection often decides what a method returns.</p>",
code:`public static String shipping(double total) {
    if (total >= 50) {
        return "FREE";
    } else {
        return "$5.99";
    }
}
shipping(62.0);   // "FREE"
shipping(49.99);  // "$5.99"`,
logic:["Each branch returns a different value.","The boundary value 50 gets free shipping because of >=.","Always test values right at the boundary."]}],
mistakes:["A semicolon after the condition: <code>if (x > 5);</code> makes an empty if.","Missing braces around multi-line bodies.","Using == on Strings in the condition."],
tip:"In trace questions, write T or F next to each condition as you evaluate it, then follow only the branches that run."};

NOTES["2.4"]={
lo:[["2.4.A","Write nested selection statements and determine the result.",[["2.4.A.1","Nested if statements are if, if-else, or if-else-if statements placed inside other selection statements."],["2.4.A.2","The condition of an inner if is checked only if the outer condition was true."],["2.4.A.3","A multiway if-else-if runs at most one branch: the first whose condition is true. A final else runs only when every condition is false."]]]],
secs:[
{h:"Multiway selection",p:"<p>An if-else-if chain checks conditions top to bottom and stops at the first true one. Put the most restrictive condition first.</p>",
code:`public static String letter(int score) {
    if (score >= 90) {
        return "A";
    } else if (score >= 80) {
        return "B";
    } else if (score >= 70) {
        return "C";
    } else {
        return "F";
    }
}
letter(85);   // "B"`,
logic:["85 ≥ 90 is false, so move on.","85 ≥ 80 is true: return \"B\" and skip everything else.","If the checks were in the opposite order (≥ 70 first), 85 would get a \"C\"."]},
{h:"Nested if",p:"<p>An inner if is reached only when the outer condition is true.</p>",
code:`boolean member = true;
int age = 15;

if (member) {
    if (age < 18) {
        System.out.println("Youth member price");
    } else {
        System.out.println("Adult member price");
    }
} else {
    System.out.println("Full price");
}
// Output: Youth member price`,
logic:["member is true, so we enter the outer block.","age &lt; 18 is true, so the youth price prints.","If member were false, the age would never be checked."]}],
mistakes:["Using separate ifs where else-if was needed, so several branches run.","Ordering conditions from least to most restrictive.","Matching an else to the wrong if when braces are missing."],
tip:"When an if-else-if question asks for output, stop at the first true condition. Students often keep going."};

NOTES["2.5"]={
lo:[["2.5.A","Write compound Boolean expressions and determine their values.",[["2.5.A.1","The logical operators ! (not), && (and), and || (or) combine Boolean expressions. ! is evaluated first, then &&, then ||. The result is a boolean."],["2.5.A.2","Short-circuit evaluation: if the left side of && or || already decides the result, the right side is not evaluated."]]]],
secs:[
{h:"&&, ||, and !",p:"<table><tr><th>a</th><th>b</th><th>a &amp;&amp; b</th><th>a || b</th></tr><tr><td>T</td><td>T</td><td>T</td><td>T</td></tr><tr><td>T</td><td>F</td><td>F</td><td>T</td></tr><tr><td>F</td><td>T</td><td>F</td><td>T</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td></tr></table>",
code:`int age = 16;
boolean permit = true;

boolean canDrive = age >= 16 && permit;        // true
boolean discount = age < 13 || age >= 65;      // false
boolean teen = !(age < 13 || age > 19);        // true

// Precedence: ! then && then ||
boolean r = true || false && false;            // true
// && first: false && false = false; then true || false = true`,
logic:["&& needs both sides true.","|| needs at least one side true.","Without parentheses, && is done before ||."]},
{h:"Short-circuit evaluation",p:"<p>Java stops as soon as it knows the answer. Use this to guard against errors.</p>",
code:`String name = null;
if (name != null && name.length() > 3) {
    System.out.println("long name");
}
// No crash: name != null is false, so name.length() is never called

int count = 0;
if (count == 0 || 100 / count > 5) {
    System.out.println("safe");     // prints; no division happened
}`,
logic:["false && anything is false, so the right side is skipped.","true || anything is true, so the right side is skipped.","Put the safety check on the left."]}],
mistakes:["Writing <code>1 &lt;= x &lt;= 10</code>; Java needs <code>x &gt;= 1 &amp;&amp; x &lt;= 10</code>.","Using || where && was needed (\"between\" conditions need &&).","Putting the null check on the right side."],
tip:"For \"between\" conditions, use &&. For \"outside\" conditions, use ||."};

NOTES["2.6"]={
lo:[["2.6.A","Compare Boolean expressions to decide whether they are equivalent.",[["2.6.A.1","Two Boolean expressions are equivalent if they give the same value for every possible input. A truth table can show this."],["2.6.A.2","De Morgan's laws: !(a && b) is equivalent to !a || !b, and !(a || b) is equivalent to !a && !b."]]],
["2.6.B","Write Boolean expressions that compare object references and determine their values.",[["2.6.B.1","Several reference variables can refer to the same object. == and != check whether two references refer to the same object."],["2.6.B.2","Comparing a reference to null with == or != tells whether it refers to an object."],["2.6.B.3","A class can define an equals method that decides when two objects count as equal, usually by comparing their attributes."],["EXCL","Writing (overriding) your own equals method is not tested."]]]],
secs:[
{h:"De Morgan's laws",p:"<p>To push a <code>!</code> inside parentheses: negate each part and flip && ↔ ||. Also flip each comparison: &lt; ↔ &gt;=, &gt; ↔ &lt;=, == ↔ !=.</p>",
code:`// Original
!(temp > 90 || humid)
// De Morgan
temp <= 90 && !humid

// Original
!(x >= 0 && x < 10)
// De Morgan
x < 0 || x >= 10`,
logic:["!(temp &gt; 90) becomes temp &lt;= 90 (not temp &lt; 90).","|| became && because the ! was distributed.","Check with one test value: temp = 95 makes both versions false."]},
{h:"Truth tables",p:"<p>To prove two expressions are equivalent, list every combination of inputs and check that the results match in every row.</p>",
code:`// Is  !(a && b)  the same as  !a || !b ?
// a b | a&&b | !(a&&b) | !a | !b | !a||!b
// T T |  T   |   F     |  F |  F |   F
// T F |  F   |   T     |  F |  T |   T
// F T |  F   |   T     |  T |  F |   T
// F F |  F   |   T     |  T |  T |   T
// Columns match in every row -> equivalent`,
logic:["Two boolean inputs give 4 rows.","Compute the left and right expressions in each row.","One mismatched row is enough to show they are not equivalent."]},
{h:"Comparing references",p:"<p><code>==</code> on references asks whether they point to the same object. <code>equals</code> asks whether the objects are equal by that class's rules.</p>",
code:`String a = new String("hi");
String b = a;
String c = new String("hi");
String d = null;

a == b;          // true  (aliases)
a == c;          // false
a.equals(c);     // true
d == null;       // true
c != null;       // true`,
logic:["Only one comparison here uses equals, and it's the one that compares contents.","Checking <code>!= null</code> before calling a method avoids a NullPointerException.","Every class inherits an equals method from Object; String's version compares characters."]}],
mistakes:["Applying De Morgan without flipping the comparison operators.","Thinking <code>!(x &gt; 5)</code> is <code>x &lt; 5</code>.","Using == to compare object contents."],
tip:"\"Which is equivalent?\" questions: test one or two specific values in the original and each choice. That's faster than proving it algebraically."};

NOTES["2.7"]={
lo:[["2.7.A","Identify when an iterative process is needed.",[["2.7.A.1","Iteration repeats a block of code zero or more times, as long as a controlling Boolean expression is true."],["2.7.A.2","An infinite loop happens when the controlling expression never becomes false."],["2.7.A.3","If the controlling expression is false the first time it is checked, the loop body never runs."],["2.7.A.4","An off-by-one error is a loop that runs one time too many or one time too few."]]],
["2.7.B","Write while loops and determine the result.",[["2.7.B.1","A while loop checks its Boolean expression before every pass, including the first. The body runs while the expression is true and the loop ends when it becomes false."]]]],
secs:[
{h:"How a while loop runs",p:"<p>Check the condition → run the body → check again → … → stop when the condition is false. Something in the body must eventually make the condition false.</p>",
code:`int savings = 0;
int weeks = 0;
while (savings < 100) {
    savings += 30;
    weeks++;
}
System.out.println(weeks + " weeks, $" + savings);
// 4 weeks, $120`,
logic:["Pass 1: 0 &lt; 100, savings 30, weeks 1.","Pass 2: 60, 2. Pass 3: 90, 3. Pass 4: 120, 4.","Check: 120 &lt; 100 is false → stop. Use a while loop when you don't know in advance how many passes you need."]},
{h:"Sentinel and zero-pass loops",p:"<p>A loop can stop on a special value, and it might not run at all.</p>",
code:`int n = 50;
while (n < 10) {
    n++;          // never runs: 50 < 10 is false at the start
}

// Halving until 1 (count the steps)
int x = 40, steps = 0;
while (x > 1) {
    x /= 2;       // 20, 10, 5, 2, 1
    steps++;
}
// steps is 5`,
logic:["The first loop's body is skipped entirely.","40 → 20 → 10 → 5 → 2 → 1 is 5 halvings.","The loop variable must move toward making the condition false."]},
{h:"Infinite loops and off-by-one errors",p:"<p>Two classic bugs: the condition never becomes false, or the loop runs one time too many or too few.</p>",
code:`// Infinite: i is never updated
int i = 0;
while (i < 5) {
    System.out.print(i);
    // missing i++
}

// Off-by-one: meant to print 1-5, prints 1-4
int k = 1;
while (k < 5) {
    System.out.print(k);
    k++;
}
// fix: while (k <= 5)`,
logic:["Without <code>i++</code>, the condition stays true forever.","<code>k &lt; 5</code> stops before 5 is printed.","Test the first and last pass of every loop you write."]}],
mistakes:["Forgetting to update the loop variable.","Using &lt; where &lt;= was needed, or the reverse.","Putting a semicolon after <code>while (...)</code>, which makes an empty loop."],
tip:"Trace loops with a table that has one row per pass and a column for the condition. Stop the table on the row where the condition is false."};

NOTES["2.8"]={
lo:[["2.8.A","Write for loops and determine the result.",[["2.8.A.1","A for loop header has three parts: initialization, a Boolean expression, and an update."],["2.8.A.2","The initialization runs once, before the first check. The Boolean expression is checked before each pass. The update runs after each pass of the body, before the next check. The variable set up in the initialization is the loop control variable."],["2.8.A.3","Any for loop can be rewritten as an equivalent while loop, and any while loop as a for loop."]]]],
secs:[
{h:"Anatomy of a for loop",p:"<p>Order: initialize → check → body → update → check → body → update … → check fails → exit.</p>",
code:`for (int i = 1; i <= 5; i++) {
    System.out.print(i * i + " ");
}
// 1 4 9 16 25

// the same loop as a while loop
int i = 1;
while (i <= 5) {
    System.out.print(i * i + " ");
    i++;
}`,
logic:["i starts at 1 and is checked before each pass.","After printing, i++ runs, then the check happens again.","When i becomes 6, the check fails and the loop ends."]},
