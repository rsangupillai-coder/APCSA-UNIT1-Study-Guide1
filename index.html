{h:"Counting passes",p:"<p>For <code>for (int i = a; i &lt; b; i++)</code> the body runs <strong>b − a</strong> times. With <code>&lt;=</code> it runs <strong>b − a + 1</strong> times. With a step other than 1, list the values.</p>",
code:`for (int i = 0; i < 10; i++)    // 10 passes
for (int i = 1; i <= 10; i++)   // 10 passes
for (int i = 3; i < 9; i++)     // 6 passes
for (int i = 0; i < 10; i += 3) // i = 0, 3, 6, 9 -> 4 passes
for (int i = 10; i > 0; i -= 2) // 10, 8, 6, 4, 2 -> 5 passes`,
logic:["Use the formula for steps of 1.","List values for other steps; it avoids off-by-one mistakes.","Counting down works the same way."]},
{h:"Using the loop variable",p:"<p>The loop variable is often used in the body: as a number, as an index, or to build a result.</p>",
code:`// Sum of 1..n
int n = 100, sum = 0;
for (int i = 1; i <= n; i++) {
    sum += i;
}
// sum is 5050

// Countdown string
String s = "";
for (int i = 3; i >= 1; i--) {
    s += i + "...";
}
s += "Go!";     // "3...2...1...Go!"`,
logic:["sum accumulates 1 + 2 + … + 100.","The loop variable is declared in the header, so it doesn't exist after the loop.","Building a String with += inside a loop is a common pattern (2.10)."]}],
mistakes:["Changing the loop variable inside the body as well as in the header.","Using the loop variable after the loop when it was declared in the header.","Off-by-one in the condition."],
tip:"If a question asks \"how many times does the body run\", list the first two and last two values of the loop variable."};

NOTES["2.9"]={
lo:[["2.9.A","Write standard and original algorithms that don't need data structures, and determine their result.",[["2.9.A.1","Standard algorithms include: checking whether one integer divides another, extracting the digits of an integer, counting how often a condition is met, finding a minimum or maximum, and computing a sum or average."]]]],
secs:[
{h:"Divisibility and digits",p:"<p><code>a % b == 0</code> means b divides a evenly. <code>n % 10</code> gives the last digit; <code>n / 10</code> removes it.</p>",
code:`// Count the digits of n that are divisible by 3
int n = 39614, count = 0;
while (n > 0) {
    int digit = n % 10;
    if (digit % 3 == 0) {
        count++;
    }
    n /= 10;
}
// digits checked: 4, 1, 6, 9, 3 -> 6, 9, 3 qualify -> count is 3`,
logic:["Each pass peels off the last digit.","0 counts as divisible by 3 (0 % 3 == 0), so watch for zeros.","The loop ends when n becomes 0."]},
{h:"Min, max, sum, average",p:"<p>Start min/max with the first value (never 0), start sums at 0, and divide as a double for averages.</p>",
code:`// Scores come from a method getScore(i) for i = 1..5
int max = getScore(1);
int min = getScore(1);
int sum = 0;
for (int i = 1; i <= 5; i++) {
    int s = getScore(i);
    sum += s;
    if (s > max) max = s;
    if (s < min) min = s;
}
double avg = (double) sum / 5;`,
logic:["Starting max at 0 fails if every score is negative; starting at the first value always works.","Each value is used three ways in one pass.","The cast keeps the decimal in the average."]},
{h:"Counting with a condition",p:"<p>A counter starts at 0 and increases only when a condition is true.</p>",
code:`// How many numbers from 1 to 100 are multiples of 7 but not of 2?
int count = 0;
for (int k = 1; k <= 100; k++) {
    if (k % 7 == 0 && k % 2 != 0) {
        count++;
    }
}
// 7, 21, 35, 49, 63, 77, 91 -> count is 7`,
logic:["The condition combines two divisibility tests with &&.","Only qualifying numbers increase count.","This pattern appears in nearly every FRQ 1."]}],
mistakes:["Initializing max to 0.","Integer division in an average.","Forgetting to update n in a digit loop (infinite loop)."],
tip:"FRQ 1 (methods and control structures) almost always uses one of these patterns. Learn them until you can write them without thinking."};

NOTES["2.10"]={
lo:[["2.10.A","Write standard and original String algorithms and determine their result.",[["2.10.A.1","Standard String algorithms check whether substrings have a property, count substrings that meet a condition, and build a new String with the characters in reverse order."]]]],
secs:[
{h:"Visiting each character",p:"<p>Loop from 0 to <code>length() - 1</code> and use <code>substring(i, i + 1)</code> to get one character as a String.</p>",
code:`String word = "Mississippi";
int count = 0;
for (int i = 0; i < word.length(); i++) {
    String ch = word.substring(i, i + 1);
    if (ch.equals("s")) {
        count++;
    }
}
// count is 4`,
logic:["i stops at length() − 1, so substring never goes out of bounds.","Compare one-character Strings with equals.","\"M\" and \"m\" are different; case matters."]},
{h:"Checking longer substrings",p:"<p>To check substrings of length k, stop the loop at <code>length() - k</code>.</p>",
code:`// Count how many times "ss" appears (overlapping allowed)
String w = "Mississippi";
int pairs = 0;
for (int i = 0; i <= w.length() - 2; i++) {
    if (w.substring(i, i + 2).equals("ss")) {
        pairs++;
    }
}
// found at 2 and 5 -> pairs is 2`,
logic:["The last valid start for a 2-character piece is length − 2.","<code>i &lt;= w.length() - 2</code> is the same as <code>i &lt; w.length() - 1</code>.","To find words or patterns, you can also use indexOf."]},
{h:"Reversing and building Strings",p:"<p>Build a new String by adding characters one at a time. Adding to the front reverses the order.</p>",
code:`public static String reverse(String s) {
    String result = "";
    for (int i = 0; i < s.length(); i++) {
        result = s.substring(i, i + 1) + result;
    }
    return result;
}
reverse("PCTI");   // "ITCP"

public static boolean isPalindrome(String s) {
    return s.equals(reverse(s));
}
isPalindrome("level");   // true`,
logic:["Each character goes in front of what has been built so far.","Another way: loop from the end to 0 and add to the back.","Reusing reverse inside isPalindrome is procedural abstraction."]}],
mistakes:["Looping to <code>i &lt;= s.length()</code> (out of bounds).","Comparing characters with == instead of equals.","Forgetting that a String is not changed unless you reassign it."],
tip:"For every String loop, ask: what is the last index my substring call can safely use?"};

NOTES["2.11"]={
lo:[["2.11.A","Write nested iteration and determine the result.",[["2.11.A.1","When a loop is inside the body of another loop, the inner loop must finish all of its passes before the outer loop moves on to its next pass."]]]],
secs:[
{h:"Inner loop runs completely each time",p:"<p>For every single pass of the outer loop, the inner loop starts over and runs all the way through.</p>",
code:`for (int row = 1; row <= 3; row++) {
    for (int col = 1; col <= 4; col++) {
        System.out.print(row * col + "\\t");
    }
    System.out.println();
}
// 1  2  3  4
// 2  4  6  8
// 3  6  9  12`,
logic:["row = 1: col goes 1, 2, 3, 4, then a new line.","row = 2: col restarts at 1.","The body of the inner loop runs 3 × 4 = 12 times."]},
{h:"Inner bounds that depend on the outer variable",p:"<p>Many patterns make the inner loop's limit depend on the outer loop variable.</p>",
code:`for (int i = 1; i <= 4; i++) {
    for (int j = 1; j <= i; j++) {
        System.out.print("*");
    }
    System.out.println();
}
// *
// **
// ***
// ****
// stars printed: 1 + 2 + 3 + 4 = 10`,
logic:["Row i prints i stars.","Total inner passes are a sum, not a product.","This is the same counting idea as 2.12."]},
{h:"Nested loops with Strings",p:"<p>Nested loops can compare every pair of characters.</p>",
code:`// Does the word have any repeated letter?
String w = "coding";
boolean repeat = false;
for (int i = 0; i < w.length(); i++) {
    for (int j = i + 1; j < w.length(); j++) {
        if (w.substring(i, i + 1).equals(w.substring(j, j + 1))) {
            repeat = true;
        }
    }
}
// repeat is false`,
logic:["j starts at i + 1, so each pair is compared once and a letter is never compared to itself.","This is the duplicate-finding pattern you'll use with arrays in Unit 4.","A return or a boolean flag records the result."]}],
mistakes:["Using the same variable name for both loops.","Putting <code>println</code> inside the inner loop by accident.","Multiplying pass counts when the inner bound depends on the outer variable."],
tip:"For nested loop output questions, trace the first two passes of the outer loop carefully; the pattern usually becomes clear."};

NOTES["2.12"]={
lo:[["2.12.A","Count how many times statements run in iterative code and compare run times informally.",[["2.12.A.1","A statement execution count is how many times a statement runs. It is usually found by tracing and analyzing loops, and lets us compare how efficient different algorithms are."]]]],
secs:[
{h:"Counting executions",p:"<p>Count passes of each loop, then multiply (fixed nested bounds) or add (changing bounds).</p>",
code:`int c = 0;
for (int i = 0; i < 5; i++) {         // 5 passes
    for (int j = 0; j < 3; j++) {     // 3 passes each time
        c++;                          // runs 5 * 3 = 15 times
    }
}

int d = 0;
for (int i = 0; i < 5; i++) {
    for (int j = 0; j < i; j++) {     // 0, 1, 2, 3, 4 passes
        d++;                          // runs 0+1+2+3+4 = 10 times
    }
}`,
logic:["With fixed bounds, multiply.","When the inner bound depends on i, add up the passes for each i.","Final values: c = 15, d = 10."]},
{h:"Comparing algorithms",p:"<p>As input size n grows, a single loop does about n steps and a nested loop does about n × n steps. A loop that halves or doubles its variable does very few steps.</p>",
code:`// About n steps
for (int i = 0; i < n; i++) { ... }

// About n * n steps
for (int i = 0; i < n; i++)
    for (int j = 0; j < n; j++) { ... }

// About log2(n) steps
for (int i = 1; i < n; i *= 2) { ... }   // n = 1024 -> 10 passes`,
logic:["For n = 1,000: about 1,000 vs. 1,000,000 vs. 10 steps.","Doubling n doubles the first, quadruples the second, and adds only one step to the third.","You won't need Big-O notation; just compare the counts."]}],
mistakes:["Multiplying when the inner bound changes.","Forgetting that a loop can run zero times.","Counting the header check instead of the body."],
tip:"Write the loop variable's values in a list before counting. It turns a tricky question into simple arithmetic."};
NOTES["3.1"]={
lo:[["3.1.A","Show a program's design in diagrams of its classes, including each class's attributes, behaviors, and the data and procedural abstractions it uses.",[["3.1.A.1","Abstraction reduces complexity by focusing on the main idea and hiding details that don't matter."],["3.1.A.2","Data abstraction separates what a type of data is used for from how it is actually stored."],["3.1.A.3","Attributes are declared outside of any method. Instance variables are unique to each object; class variables are shared by all objects of the class."],["3.1.A.4","Procedural abstraction lets you use a process by its name without knowing how it works. Method decomposition breaks a large behavior into smaller methods that can be reused."],["3.1.A.5","Parameters make a procedure general, so it can be reused with different inputs."],["3.1.A.6","A method's inside can be changed (for example, to be faster) without affecting its users, as long as its signature and what it does stay the same."],["3.1.A.7","It helps to design a class's attributes and behaviors before writing it. The design can be written in words or as a diagram."]]]],
secs:[
{h:"Designing a class before coding",p:"<p>List what the object <strong>has</strong> and what it <strong>does</strong>. A UML-style diagram uses <code>-</code> for private and <code>+</code> for public.</p>",
code:`// ┌──────────────────────────────┐
// │ BankAccount                  │
// ├──────────────────────────────┤
// │ - owner : String             │
// │ - balance : double           │
// ├──────────────────────────────┤
// │ + BankAccount(String owner)  │
// │ + deposit(double amt) : void │
// │ + getBalance() : double      │
// └──────────────────────────────┘`,
logic:["Attributes (data) go in the middle box, methods (behaviors) in the bottom box.","The diagram shows what the class is used for, not how methods are written. That is data abstraction.","FRQ 2 asks you to turn a description like this into a complete class."]},
{h:"Procedural abstraction and decomposition",p:"<p>Break big jobs into small methods, give each a clear name, and use parameters so they work for many inputs.</p>",
code:`public static boolean isLeapYear(int y) {
    return (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;
}

public static int daysInYear(int y) {
    if (isLeapYear(y)) return 366;
    return 365;
}

public static int daysBetweenYears(int start, int end) {
    int total = 0;
    for (int y = start; y < end; y++) {
        total += daysInYear(y);
    }
    return total;
}`,
logic:["Each method does one job, and the bigger method calls the smaller ones.","Because of the parameter y, isLeapYear works for any year.","isLeapYear could be rewritten another way and daysInYear would not need to change (3.1.A.6)."]}],
mistakes:["Writing one huge method instead of several small ones.","Forgetting that attributes are declared outside any method.","Designing behaviors that don't match the problem description."],
tip:"On FRQs, if a helper method is given (\"implementation not shown\"), use it. Rewriting what it does wastes time and can cost points."};

NOTES["3.2"]={
lo:[["3.2.A","Explain the social and ethical effects of computing systems.",[["3.2.A.1","A reliable program does what it is supposed to under the conditions stated. Programmers should test under many different conditions to make programs as reliable as possible."],["3.2.A.2","Programs affect society, the economy, and culture, in helpful and harmful ways. A program can cause harm that was never intended, even while doing its job."],["3.2.A.3","Writing programs raises legal and intellectual-property issues. Open-source code can usually be reused under its license; other code needs permission and may need to be bought."]]],
["3.2.B","Explain how artificial intelligence is used in writing code, and its limits.",[["3.2.B.1","Artificial intelligence (AI) simulates intelligent behavior. Using AI tools to generate code can save development time."],["3.2.B.2","AI-generated code may be incomplete or not work, so programmers often need to fix it by hand."],["3.2.B.3","A clear and thorough program design makes AI tools more useful for producing working code."],["3.2.B.4","Code produced with AI can contain bias, including bias against groups of people."]]]],
secs:[
{h:"Reliability and testing",p:"<p>Test with <strong>normal</strong> values, <strong>boundary</strong> values, and <strong>unusual</strong> values. A program that works only on the example in the problem is not reliable.</p>",
code:`public static String grade(int score) {
    if (score >= 90) return "A";
    if (score >= 80) return "B";
    return "C or below";
}

// Test plan
// normal:   85  -> "B"
// boundary: 90  -> "A",  89 -> "B",  80 -> "B"
// unusual:  0   -> "C or below",  100 -> "A"`,
logic:["Boundaries are where off-by-one bugs hide.","Testing 89 and 90 confirms that >= is right.","A good test plan is written before the code."]},
{h:"Impact, intellectual property, and AI",p:"<p>Every program has effects beyond its main purpose. Ask who uses it, who could be harmed, and whose code you're using.</p><ul><li><strong>Unintended effects:</strong> a recommendation app built to help people find music can also keep them scrolling for hours.</li><li><strong>Intellectual property:</strong> open-source code comes with a license (for example, give credit). Code that isn't open-source needs permission.</li><li><strong>AI tools:</strong> they can speed up coding, but their output must be read, tested, and often fixed. A clear design (3.1) leads to better AI output. AI output can also carry bias from the data it learned from.</li></ul>",
code:`// Checklist before using AI-generated code
// 1. Do I understand every line?
// 2. Did I test normal, boundary, and unusual inputs?
// 3. Does it follow the class design and the method signatures?
// 4. Could it treat any group of users unfairly?`,
logic:["You are responsible for code you submit, whoever or whatever wrote it.","Testing finds the gaps AI tools leave.","Bias checks matter most when a program makes decisions about people."]}],
mistakes:["Testing only with the example values.","Assuming code found online is free to copy.","Trusting AI-generated code without reading and testing it."],
tip:"Questions on this topic are about reasoning, not memorizing. Pick the answer that names a specific person or group affected, or a specific test case."};

NOTES["3.3"]={
lo:[["3.3.A","Write code that sets the access and visibility of classes, data, constructors, and methods.",[["3.3.A.1","Data encapsulation hides how a class is implemented from other classes. The keyword private allows access only within the declaring class; public allows access from outside it."],["3.3.A.2","In this course, classes are always declared public, using the keyword class."],["3.3.A.3","In this course, constructors are always public."],["3.3.A.4","Instance variables belong to each object; every object has its own copy."],["3.3.A.5","To keep encapsulation, instance variables should be private unless the class specification says otherwise."],["3.3.A.6","Public methods can be called from inside or outside the class. Private methods can be called only from inside the class."]]]],
secs:[
{h:"The parts of a class",p:"<p>A class has instance variables (state), constructors (setup), and methods (behavior).</p>",
code:`public class Thermostat {
    // instance variables: private
    private int targetTemp;
    private boolean heatOn;

    // constructor: public, same name as the class, no return type
    public Thermostat(int start) {
        targetTemp = start;
        heatOn = false;
    }

    // public methods: the class's interface
    public void raise() {
        targetTemp++;
        updateHeat();
    }
    public int getTarget() {
        return targetTemp;
    }

    // private helper: only this class can call it
    private void updateHeat() {
        heatOn = targetTemp > 68;
    }
}`,
logic:["Other classes can call raise and getTarget but cannot touch targetTemp directly.","updateHeat is private because it's a detail of how the class works.","Each Thermostat object has its own targetTemp and heatOn."]},
{h:"Why encapsulation?",p:"<p>Private data can only change through methods you control, so the object can't be put into an invalid state.</p>",
code:`Thermostat t = new Thermostat(70);
t.raise();
System.out.println(t.getTarget());   // 71

// t.targetTemp = -500;   // compile error: targetTemp is private`,
logic:["Outside code must go through public methods.","The class could add a check in raise() (like a maximum temperature) without changing any outside code.","On FRQ 2, making instance variables private is part of the scoring."]}],
mistakes:["Making instance variables public.","Declaring instance variables inside a method (they become local variables).","Giving a constructor a return type."],
tip:"FRQ 2 checklist: public class, private instance variables, public constructor that sets every variable, public methods with the exact headers shown."};

NOTES["3.4"]={
lo:[["3.4.A","Write code that declares instance variables for the attributes a class's constructors set up.",[["3.4.A.1","An object's state is its attributes and their values at a given time, stored in instance variables. This is a has-a relationship."],["3.4.A.2","A constructor sets up an object's starting state by giving every instance variable a value, often from parameters. Creating the object reserves memory and returns a reference to it."],["3.4.A.3","When a constructor receives a mutable object, it should store a copy of it, so the original can't be changed through the new object."],["3.4.A.4","If a class has no constructor, Java provides a default one with no parameters that sets every instance variable to its default value."],["3.4.A.5","Default values: 0 for int, 0.0 for double, false for boolean, and null for reference types."]]]],
secs:[
{h:"Writing constructors",p:"<p>A constructor's job is to give every instance variable a sensible starting value. Some values come from parameters; some are fixed.</p>",
code:`public class Bottle {
    private double capacity;
    private double amount;

    public Bottle(double cap) {
        capacity = cap;
        amount = cap;        // starts full
    }
}

Bottle b = new Bottle(750.0);   // capacity 750.0, amount 750.0`,
logic:["Not every instance variable needs its own parameter.","Every instance variable should be set on purpose, even when the default value happens to be correct.","This mirrors 2026 FRQ 2, where the bottle starts full."]},
{h:"Overloaded constructors and defaults",p:"<p>A class may offer several constructors. If you write none, Java gives you a no-parameter one that uses default values. If you write any, that free one disappears.</p>",
code:`public class Player {
    private String name;
    private int level;

    public Player() {
        name = "Guest";
        level = 1;
    }
    public Player(String n, int lv) {
        name = n;
        level = lv;
    }
}

Player p1 = new Player();             // Guest, 1
Player p2 = new Player("Zoe", 7);     // Zoe, 7`,
logic:["Java chooses the constructor by matching arguments.","Without the first constructor, <code>new Player()</code> would not compile.","Defaults (0, 0.0, false, null) apply only to variables you don't set."]},
{h:"Copying mutable parameters",p:"<p>If a constructor stores a reference to an outside list or array, outside code can still change it. Copy it instead.</p>",
code:`public class Roster {
    private ArrayList<String> names;

    public Roster(ArrayList<String> start) {
        names = new ArrayList<String>();
        for (String s : start) {
            names.add(s);           // copy each element
        }
    }
}`,
logic:["Writing <code>names = start;</code> would share the same list with the caller.","Copying protects the object's state (encapsulation).","Strings themselves are immutable, so copying the references to them is enough."]}],
mistakes:["Writing <code>int amount = cap;</code> inside the constructor, which creates a local variable instead of setting the field.","Leaving an instance variable unset.","Mixing up the parameter order when calling the constructor."],
tip:"Never redeclare the type of an instance variable inside a constructor. It's one of the most common FRQ 2 errors."};

NOTES["3.5"]={
lo:[["3.5.A","Write methods that define object behaviors using primitive values, and determine the result of calling them.",[["3.5.A.1","A void method does not return a value. Its header uses the keyword void before the method name."],["3.5.A.2","A non-void method returns a single value. Its header gives the type of that value before the method name."],["3.5.A.3","In a return statement, the expression is evaluated and its value is sent back to the caller."],["3.5.A.4","A return statement passes control back to the caller immediately. Code after it does not run; a return inside a loop or an if ends the whole method."],["3.5.A.5","An accessor method is non-void and lets other code get the value of an instance or class variable (it returns a copy of the value)."],["3.5.A.6","A mutator method changes the values of instance or class variables. It is often void."],["3.5.A.7","Methods with parameters receive values through them and use those values to do their job."],["3.5.A.8","When an argument is a primitive, the parameter gets a copy of its value. Changing the parameter does not change the caller's variable."]]]],
secs:[
{h:"Accessors and mutators",p:"<p>Accessors report state; mutators change it.</p>",
code:`public class Bottle {
    private double capacity;
    private double amount;

    public Bottle(double cap) { capacity = cap; amount = cap; }

    // accessor
    public double getAmount() { return amount; }

    // mutator that also returns a value
    public double use(double used) {
        amount -= used;
        if (amount < 0.25 * capacity) {
            amount = capacity;      // refill
        }
        return amount;
    }
}

Bottle b = new Bottle(1000);
b.use(300);   // 700.0
b.use(500);   // 200.0 is below 250 -> refilled -> 1000.0`,
logic:["getAmount changes nothing; it only returns a value.","use changes amount, so it's a mutator, even though it is not void.","Trace the instance variable after each call, like a variable table."]},
{h:"return ends the method",p:"<p>As soon as a <code>return</code> runs, the method is over. This is useful for stopping a search early.</p>",
code:`public static int firstMultiple(int start, int factor) {
    for (int n = start; n < start + factor; n++) {
        if (n % factor == 0) {
            return n;          // leaves the loop AND the method
        }
    }
    return -1;                 // only reached if no return above ran
}
firstMultiple(22, 5);   // 25`,
logic:["n goes 22, 23, 24, 25; at 25 the method returns right away.","Code after a return in the same block would never run.","Every path through a non-void method must end in a return."]},
{h:"Primitive parameters are copies",p:"<p>A method can't change a caller's primitive variable through a parameter.</p>",
code:`public static void addBonus(int score) {
    score += 10;
    System.out.println("inside: " + score);
}

int myScore = 80;
addBonus(myScore);                       // inside: 90
System.out.println("outside: " + myScore); // outside: 80`,
logic:["score is a new variable holding a copy of 80.","Only the copy changes.","To get a changed value back, return it and assign it: <code>myScore = withBonus(myScore);</code>."]}],
mistakes:["Printing a value when the method is supposed to return it.","A non-void method that can reach the end without returning.","Expecting a primitive argument to change."],
tip:"On FRQs, if a method says \"returns\", it must return. Printing instead of returning loses points."};

NOTES["3.6"]={
lo:[["3.6.A","Write methods that use object references, and determine the result of calling them.",[["3.6.A.1","When an argument is an object reference, the parameter gets a copy of the reference, not a copy of the object. The method can change the object's state through it. It's good practice not to change mutable objects passed as parameters unless the specification requires it."],["3.6.A.2","When a method returns an object reference, it returns that same reference, not a reference to a new copy of the object."],["3.6.A.3","A method can access a parameter object's private data and methods only if the parameter is the same type as the class the method is in."]]]],
secs:[
{h:"Passing object references",p:"<p>The parameter and the argument point to the <strong>same</strong> object. Changes made through the parameter are seen by the caller. Reassigning the parameter to a new object is not.</p>",
code:`public static void drink(Bottle b) {
    b.use(100);              // changes the caller's object
}
public static void swapOut(Bottle b) {
    b = new Bottle(500);     // only changes the local copy of the reference
}

Bottle mine = new Bottle(1000);
drink(mine);
System.out.println(mine.getAmount());   // 900.0
swapOut(mine);
System.out.println(mine.getAmount());   // still 900.0`,
logic:["drink calls a mutator on the shared object.","swapOut makes its own parameter point somewhere else; mine is untouched.","Draw arrows from variables to objects to trace these."]},
{h:"Accessing another object of the same class",p:"<p>Inside a class, you may use another object's private variables if it's the same class.</p>",
code:`public class Point {
    private int x, y;
    public Point(int x, int y) { this.x = x; this.y = y; }

    public double distanceTo(Point other) {
        int dx = x - other.x;      // allowed: other is a Point
        int dy = y - other.y;
        return Math.sqrt(dx * dx + dy * dy);
    }
}

new Point(0, 0).distanceTo(new Point(3, 4));   // 5.0`,
logic:["other.x is private, but this code is inside Point, so it's allowed.","From any other class, other.x would not compile.","Returning a reference (for example, return other;) hands back the same object, not a copy."]}],
mistakes:["Thinking the method gets its own copy of the object.","Expecting reassignment of a parameter to affect the caller.","Changing a parameter object when the problem says not to (several FRQs say the list must stay unchanged)."],
tip:"If an FRQ says a parameter or a list \"should not be modified\", build a new object or list for your result."};

NOTES["3.7"]={
lo:[["3.7.A","Write class methods that define behaviors of the class.",[["3.7.A.1","Class methods can't access or change instance variables, or call instance methods, unless an object is passed to them as a parameter."],["3.7.A.2","Class methods can access and change class variables and can call other class methods."]]],
["3.7.B","Write code that declares class variables.",[["3.7.B.1","A class variable belongs to the class, and all objects share one copy of it. It is declared with static."],["3.7.B.2","A public class variable is accessed from outside the class with the class name and the dot operator."],["3.7.B.3","A variable declared final can't be changed once it has a value."]]]],
secs:[
{h:"Shared data with static",p:"<p>Instance variables: one per object. Class (static) variables: one for the whole class.</p>",
code:`public class Ticket {
    private static int nextNumber = 1;    // shared by all tickets
    public static final int MAX = 500;    // constant

    private int number;                   // each ticket's own

    public Ticket() {
        number = nextNumber;
        nextNumber++;
    }
    public int getNumber() { return number; }
    public static int ticketsIssued() { return nextNumber - 1; }
}

Ticket a = new Ticket();   // number 1
Ticket b = new Ticket();   // number 2
Ticket.ticketsIssued();    // 2
Ticket.MAX;                // 500`,
logic:["nextNumber increases with every constructor call, no matter which object is created.","Each ticket remembers its own number.","MAX is public static final: shared, readable as Ticket.MAX, and unchangeable."]},
{h:"What static methods can't do",p:"<p>A static method doesn't run on any particular object, so it has no instance variables to use unless an object is passed in.</p>",
code:`public class Ticket {
    // ...
    public static int bad() {
        return number;             // compile error: which ticket's number?
    }
    public static int numberOf(Ticket t) {
        return t.getNumber();      // fine: an object was passed in
    }
}`,
logic:["Inside a static method, there is no current object.","Passing an object gives the method something to work with.","Static methods can freely use static variables like nextNumber."]}],
mistakes:["Making a counter an instance variable, so each object counts only itself.","Using an instance variable in a static method.","Trying to change a final variable."],
tip:"If a value should be the same for every object (a count, a constant, a shared setting), it is static."};

NOTES["3.8"]={
lo:[["3.8.A","Explain where variables can be used in code.",[["3.8.A.1","Local variables, including method and constructor parameters, can be used only inside the block where they are declared. They can't be declared public or private."],["3.8.A.2","When a local variable or parameter has the same name as an instance variable, the name refers to the local variable inside that method or constructor."]]]],
secs:[
{h:"Scope",p:"<p>A variable exists from its declaration to the closing brace of the block it was declared in.</p>",
code:`public class Scope {
    private int total;                    // whole class

    public void add(int amount) {         // amount: this method only
        int doubled = amount * 2;         // doubled: this method only
        for (int i = 0; i < 2; i++) {     // i: this loop only
            total += doubled;
        }
        // System.out.println(i);         // error: i is out of scope
    }
}`,
logic:["total can be used in every method of Scope.","amount and doubled vanish when add ends.","i exists only inside the for loop."]},
{h:"Shadowing",p:"<p>A parameter with the same name as an instance variable hides it. Use <code>this.</code> (3.9) to reach the instance variable.</p>",
code:`public class Account {
    private int balance;

    public Account(int balance) {
        balance = balance;        // BUG: assigns the parameter to itself
    }
    public Account(int balance, boolean fixed) {
        this.balance = balance;   // correct
    }
}`,
logic:["In the first constructor, both names refer to the parameter, so the field stays 0.","this.balance always means the instance variable.","Or avoid the issue by giving the parameter a different name."]}],
mistakes:["Using a loop variable after the loop.","Declaring a local variable with the same name as a field by accident (often inside a constructor).","Putting public or private on a local variable."],
tip:"In trace questions, when a name appears twice, look for the closest declaration. That's the variable being used."};

NOTES["3.9"]={
lo:[["3.9.A","Write expressions that use this, and determine their result.",[["3.9.A.1","Inside an instance method or constructor, this refers to the current object, whose method or constructor is running."],["3.9.A.2","this can be passed as an argument to a method."],["3.9.A.3","Class (static) methods have no this reference."]]]],
secs:[
{h:"this as the current object",p:"<p><code>this</code> is a reference to the object the method was called on.</p>",
code:`public class Robot {
    private String name;
    private int x;

    public Robot(String name, int x) {
        this.name = name;
        this.x = x;
    }
    public boolean isLeftOf(Robot other) {
        return this.x < other.x;
    }
}

Robot a = new Robot("A", 2), b = new Robot("B", 9);
a.isLeftOf(b);   // true: inside the call, this is a, other is b`,
logic:["In the constructor, this.name is the field and name is the parameter.","In <code>a.isLeftOf(b)</code>, this refers to a.","this.x and x mean the same thing when no local variable is named x."]},
{h:"Passing this",p:"<p>An object can hand itself to another method.</p>",
code:`public class Robot {
    // ...
    public void register(Factory f) {
        f.addRobot(this);    // the factory gets a reference to this robot
    }
}`,
logic:["The Factory stores a reference to the same Robot object.","No copy is made.","this can't be used inside a static method, because there is no current object."]}],
mistakes:["Forgetting this when a parameter shadows a field.","Using this inside a static method.","Thinking this creates a new object."],
tip:"FRQ 2 solutions commonly use this.x = x in constructors. Either that or different parameter names is fine."};
NOTES["4.1"]={
lo:[["4.1.A","Explain the privacy risks of collecting and storing personal data on computers.",[["4.1.A.1","Using computers puts personal privacy at risk. Programmers should try to protect users' privacy, for example by encapsulating personal attributes so they can't be read or changed from outside the class."]]],
["4.1.B","Explain why it matters to check the quality of a data set and its possible problems before using it.",[["4.1.B.1","Algorithmic bias is a repeated, systematic error in a program that produces unfair results for a particular group of users."],["4.1.B.2","Before drawing conclusions from a data set, programmers should understand how it was collected and how that could introduce bias."],["4.1.B.3","Incomplete or inaccurate data can make a program work incorrectly or inefficiently."]]],
["4.1.C","Choose a data set that fits a problem or question.",[["4.1.C.1","A data set collected for one topic may not give valid answers to a question about a different topic."]]]],
secs:[
{h:"Privacy and encapsulation",p:"<p>Personal data (names, locations, grades, health) should be collected only when needed and protected in code. Private instance variables are one layer of protection.</p>",
code:`public class StudentRecord {
    private String name;
    private String studentId;     // never exposed directly
    private double gpa;

    public String getName() { return name; }

    // Show only the last 3 characters of the ID
    public String getMaskedId() {
        return "****" + studentId.substring(studentId.length() - 3);
    }
}`,
logic:["There is no getter that returns the full ID.","Callers can still do their job (identify a record) without seeing everything.","Collecting less data in the first place is the strongest protection."]},
{h:"Bias and data quality",p:"<p>A program is only as fair as its data. Ask: who collected it, how, who is missing, and is it complete and accurate? Does it actually match my question?</p><ul><li><strong>Biased collection:</strong> a survey given only during lunch misses students who work through lunch.</li><li><strong>Incomplete data:</strong> missing scores counted as 0 drag the average down.</li><li><strong>Wrong data set:</strong> city bus ridership data can't answer a question about bike lanes.</li></ul>",
code:`// Skip missing values instead of treating them as 0
int sum = 0, count = 0;
for (int s : scores) {
    if (s >= 0) {          // -1 marks a missing score
        sum += s;
        count++;
    }
}
double avg = (double) sum / count;`,
logic:["Counting missing values as 0 would be inaccurate.","Only real scores go into the average.","Documenting how missing values are marked is part of good data practice."]}],
mistakes:["Assuming data is neutral because a computer processed it.","Using a data set to answer a question it wasn't collected for.","Exposing private data through getters that return everything."],
tip:"For ethics questions, choose answers that name a specific source of bias or a specific privacy protection."};

NOTES["4.2"]={
lo:[["4.2.A","Describe everyday data sets and the algorithms that use them, in words or diagrams.",[["4.2.A.1","A data set is a collection of individual pieces of information."],["4.2.A.2","Data sets can be analyzed to solve problems or answer questions by accessing and processing the values one at a time."],["4.2.A.3","Charts and tables can help plan the algorithm that will work with the data."]]]],
secs:[
{h:"From a question to an algorithm",p:"<p>Start with the question, sketch the data as a table, then write the steps.</p>",
code:`// Question: On how many days was the high temperature above 85°F?
//
// Day:   1   2   3   4   5   6   7
// High: 82  88  91  79  86  90  84
//
// Steps:
// 1. count = 0
// 2. For each day's high:
//      if high > 85, add 1 to count
// 3. Answer: count  (days 2, 3, 5, 6 -> 4)`,
logic:["The table makes it clear what one value looks like.","The algorithm looks at the values one at a time.","These steps become an array traversal in 4.4."]},
{h:"Common questions and their algorithms",p:"<table><tr><th>Question</th><th>Algorithm</th></tr><tr><td>What's the highest/lowest?</td><td>max / min</td></tr><tr><td>What's typical?</td><td>sum, then average</td></tr><tr><td>How many meet a condition?</td><td>count</td></tr><tr><td>Is there any / are all…?</td><td>check any / check all</td></tr><tr><td>Did it go up from one day to the next?</td><td>compare consecutive pairs</td></tr></table>",
code:`// Did the temperature ever rise 5 or more degrees in one day?
// Compare each pair: (82,88) +6 -> yes`,
logic:["Name the algorithm before writing code.","Consecutive-pair questions look at item i and item i + 1 together.","Most FRQ 3 and FRQ 4 tasks are one of these patterns applied to objects."]}],
mistakes:["Starting to code before understanding what one data item is.","Choosing an algorithm that doesn't answer the question asked.","Forgetting that values are processed one at a time."],
tip:"Sketching the data as a small table is the fastest way to plan FRQ 3 and FRQ 4."};

NOTES["4.3"]={
lo:[["4.3.A","Write code that uses one-dimensional arrays to represent collections of related data.",[["4.3.A.1","An array stores several values of the same type: primitives or object references."],["4.3.A.2","An array's size is set when it is created and can't change. Its length is read with the length attribute."],["4.3.A.3","When an array is created with new, its elements start with default values: 0 for int, 0.0 for double, false for boolean, and null for references."],["4.3.A.4","An initializer list creates an array and fills it with values in one step."],["4.3.A.5","Square brackets [ ] with an index read or change one element."],["4.3.A.6","Valid indexes go from 0 to length − 1. Any other index throws an ArrayIndexOutOfBoundsException."]]]],
secs:[
{h:"Creating arrays",p:"<p>Two ways: with <code>new</code> and a size (default values), or with an initializer list.</p>",
code:`int[] scores = new int[5];             // {0, 0, 0, 0, 0}
double[] prices = new double[3];       // {0.0, 0.0, 0.0}
boolean[] seen = new boolean[4];       // {false, false, false, false}
String[] names = new String[2];        // {null, null}

int[] primes = {2, 3, 5, 7, 11};       // initializer list
System.out.println(primes.length);     // 5  (no parentheses)`,
logic:["The type in brackets decides what each element can hold.","An array of objects starts full of null, not empty objects.","length is a field, so there are no parentheses (unlike String's length())."]},
{h:"Reading and changing elements",p:"<p>Indexes start at 0, so the last element is at <code>length - 1</code>.</p>",
code:`int[] a = {10, 20, 30, 40};
a[0] = a[3] + 1;             // a[0] is 41
a[2]++;                      // a[2] is 31
int last = a[a.length - 1];  // 40
// a[4] = 5;                 // ArrayIndexOutOfBoundsException`,
logic:["a[3] is the 4th element (40).","a.length − 1 is the safe way to reach the last element.","Index 4 doesn't exist in a length-4 array."]}],
mistakes:["Using index length as the last element.","Writing <code>arr.length()</code> or <code>arr.size()</code>.","Calling a method on an element of a new object array (it's null)."],
tip:"Write the indexes above the values when tracing array code, just like with Strings."};

NOTES["4.4"]={
lo:[["4.4.A","Write code that traverses the elements of a 1D array, and determine the result.",[["4.4.A.1","Traversing an array uses repetition to visit all of its elements, or an ordered sequence of them."],["4.4.A.2","Indexed for loops and while loops traverse an array by using each element's index."],["4.4.A.3","An enhanced for loop gives its variable a copy of each element in turn, with no index."],["4.4.A.4","Assigning a new value to an enhanced for loop variable does not change the value stored in the array."],["4.4.A.5","If the array holds object references, calling methods on the enhanced for variable can change those objects' attributes, but not which objects the array holds."],["4.4.A.6","An enhanced for loop traversal can be rewritten as an indexed for loop or a while loop."]]]],
secs:[
{h:"Indexed traversal",p:"<p>Use an index when you need the position, want to change elements, or want to visit only some of them.</p>",
code:`int[] nums = {3, 8, 1, 6};
for (int i = 0; i < nums.length; i++) {
    nums[i] = nums[i] * 10;
}
// nums is {30, 80, 10, 60}

// every other element, backward
for (int i = nums.length - 1; i >= 0; i -= 2) {
    System.out.print(nums[i] + " ");   // 60 80
}`,
logic:["<code>nums[i] = ...</code> changes the array itself.","Starting at length − 1 and going down visits the elements backward.","Step −2 skips every other element."]},
{h:"Enhanced for loop",p:"<p>Cleaner for reading every element, but the loop variable is a copy.</p>",
code:`int[] nums = {3, 8, 1, 6};
int sum = 0;
for (int n : nums) {
    sum += n;            // fine: reading
}
for (int n : nums) {
    n = 0;               // changes only the copy
}
// nums is still {3, 8, 1, 6}, sum is 18`,
logic:["Read <code>for (int n : nums)</code> as \"for each int n in nums\".","Assigning to n doesn't reach back into the array.","Use an indexed loop to modify a primitive array."]},
{h:"Arrays of objects",p:"<p>With objects, the loop variable is a copy of the <em>reference</em>, so methods called on it affect the real object.</p>",
code:`Bottle[] shelf = { new Bottle(500), new Bottle(750) };
for (Bottle b : shelf) {
    b.use(100);          // changes each Bottle object
}
// shelf[0].getAmount() is 400.0, shelf[1].getAmount() is 650.0

for (Bottle b : shelf) {
    b = new Bottle(1);   // does NOT replace anything in shelf
}`,
logic:["b and shelf[i] point to the same Bottle, so use() changes it.","Reassigning b only changes the copy of the reference.","This is the same rule as passing objects to methods (3.6)."]}],
mistakes:["<code>i &lt;= arr.length</code> (out of bounds).","Trying to modify a primitive array with an enhanced for loop.","Using the enhanced for loop when the index is needed."],
tip:"Choose your loop: need the index or need to change values? Use an indexed loop. Just reading every value? An enhanced for loop is fine."};

NOTES["4.5"]={
lo:[["4.5.A","Write standard and original array algorithms for a given context, and determine their result.",[["4.5.A.1","Standard array algorithms find a minimum or maximum, compute a sum or average, check whether at least one or all elements have a property, count elements with a property, look at consecutive pairs, find duplicates, shift or rotate elements left or right, and reverse the order of the elements."]]]],
secs:[
{h:"Any / all / count",p:"<p>\"Any\" can return true early. \"All\" can return false early. Count must look at everything.</p>",
code:`public static boolean anyNegative(int[] a) {
    for (int v : a) {
        if (v < 0) return true;     // found one: done
    }
    return false;                   // checked everything
}

public static boolean allEven(int[] a) {
    for (int v : a) {
        if (v % 2 != 0) return false;   // one counterexample: done
    }
    return true;
}`,
logic:["The final return is after the loop, not in an else inside it.","An else-return inside the loop would decide after looking at only one element.","Count works like any, but adds 1 instead of returning."]},
{h:"Consecutive pairs and duplicates",p:"<p>For pairs, stop the loop one early so <code>i + 1</code> stays in bounds. For duplicates, compare every pair with nested loops.</p>",
code:`// Longest run of increasing values
int[] t = {3, 5, 9, 2, 4, 6, 8, 1};
int best = 1, run = 1;
for (int i = 0; i < t.length - 1; i++) {
    if (t[i + 1] > t[i]) {
        run++;
        if (run > best) best = run;
    } else {
        run = 1;
    }
}
// best is 4 (2, 4, 6, 8)`,
logic:["t.length − 1 keeps t[i + 1] valid.","run grows while values increase and resets when they don't.","This is the \"longest heat wave\" pattern from 2023 FRQ 3."]},
{h:"Shift, rotate, reverse",p:"<p>Save the element that would be overwritten first.</p>",
code:`// Rotate right by one: {1, 2, 3, 4} -> {4, 1, 2, 3}
int last = a[a.length - 1];
for (int i = a.length - 1; i > 0; i--) {
    a[i] = a[i - 1];
}
a[0] = last;

// Reverse in place
for (int i = 0; i < a.length / 2; i++) {
    int temp = a[i];
    a[i] = a[a.length - 1 - i];
    a[a.length - 1 - i] = temp;
}`,
logic:["When shifting right, loop backward so you don't overwrite values you still need.","Reverse swaps only to the middle; going all the way would swap everything back.","a.length − 1 − i is the mirror position of i."]}],
mistakes:["Returning from inside an if-else on the first element.","Going out of bounds with i + 1.","Shifting in the wrong direction and copying one value everywhere."],
tip:"Memorize the any/all shape: return inside the loop for the early answer, and return the other answer after the loop."};

NOTES["4.6"]={
lo:[["4.6.A","Write code that reads data from a text file.",[["4.6.A.1","A file stores data that persists after the program ends. A program can read data from a file while it runs."],["4.6.A.2","The File and Scanner classes are used together to read a file."],["4.6.A.3","A File object is created by passing the file's name to the File constructor."],["4.6.A.4","Code must say what happens if the file can't be opened, for example by adding throws IOException to the method header. If the file name is invalid, the program stops."],["4.6.A.5","File and IOException are in the java.io package, so they must be imported."],["4.6.A.6","Scanner(File f) connects a Scanner to a file. nextInt, nextDouble, nextBoolean, next, and nextLine read the next item of the matching kind; hasNext reports whether more input is left; close ends the connection. Reading the wrong type throws an exception. (All are in the Java Quick Reference.)"],["EXCL","Reading from the keyboard is not part of this topic's exam scope."],["4.6.A.7","Mixing nextLine with the other Scanner methods on the same input can require extra handling of leftover whitespace."],["EXCL","Writing or analyzing code that mixes nextLine with other Scanner methods on the same source is not tested."],["4.6.A.8","split(String del) returns a String array of the parts of a String separated by del."],["EXCL","Special regular-expression characters in split are not tested."],["4.6.A.9","A while loop can keep reading while hasNext returns true."],["4.6.A.10","Close the Scanner when the program is done with the file."]]]],
secs:[
{h:"Reading a file line by line",p:"<p>Connect a Scanner to a File, loop while there is more data, and close it at the end.</p>",
code:`import java.io.File;
import java.io.IOException;
import java.util.Scanner;

public class ReadScores {
    public static void main(String[] args) throws IOException {
        Scanner in = new Scanner(new File("scores.txt"));
        int total = 0, count = 0;
        while (in.hasNext()) {
            total += in.nextInt();
            count++;
        }
        in.close();
        System.out.println("Average: " + (double) total / count);
    }
}
// scores.txt contains: 90 85 77 100
// Output: Average: 88.0`,
logic:["throws IOException is required because the file might be missing.","hasNext is checked before every read, so the loop stops at the end of the file.","nextInt skips spaces and line breaks between numbers."]},
{h:"Splitting comma-separated lines",p:"<p>Data files often store one record per line, with fields separated by commas. <code>split</code> turns a line into an array of Strings; convert numbers with <code>Integer.parseInt</code> or <code>Double.parseDouble</code> (4.7).</p>",
code:`// roster.txt
// Ana,11,3.9
// Ben,12,3.4

Scanner in = new Scanner(new File("roster.txt"));
while (in.hasNext()) {
    String line = in.nextLine();
    String[] parts = line.split(",");   // {"Ana", "11", "3.9"}
    String name = parts[0];
    int grade = Integer.parseInt(parts[1]);
    double gpa = Double.parseDouble(parts[2]);
    System.out.println(name + " is in grade " + grade);
}
in.close();`,
logic:["Each line becomes a String array with 3 elements.","parts[1] is the String \"11\", which parseInt turns into the int 11.","Only nextLine is used here, so there are no mixing issues."]}],
mistakes:["Forgetting the java.io imports or throws IOException.","Reading without checking hasNext.","Using a split value as a number without parsing it."],
tip:"The Java Quick Reference lists the exact Scanner and File methods you can use. Don't use others."};

NOTES["4.7"]={
lo:[["4.7.A","Use Integer and Double objects in place of int and double values, and determine the result.",[["4.7.A.1","Integer and Double are in java.lang and are immutable."],["4.7.A.2","Autoboxing automatically converts a primitive to its wrapper object (int → Integer, double → Double) when it is passed to a method expecting the wrapper or assigned to a wrapper variable."],["4.7.A.3","Unboxing automatically converts a wrapper object back to its primitive when it is passed to a method expecting the primitive or assigned to a primitive variable."],["4.7.A.4","Integer.parseInt(String s) converts a String to an int."],["4.7.A.5","Double.parseDouble(String s) converts a String to a double."]]]],
secs:[
{h:"Why wrappers exist",p:"<p>Collections like ArrayList can hold only objects, not primitives. Wrapper classes let a number be stored as an object.</p>",
code:`ArrayList<Integer> list = new ArrayList<Integer>();
list.add(42);              // autoboxing: int 42 -> Integer
int x = list.get(0);       // unboxing: Integer -> int
int doubled = list.get(0) * 2;   // unboxed for arithmetic: 84

Integer a = 7;             // autoboxing
Double d = 2.5;            // autoboxing: double -> Double`,
logic:["Java converts between int and Integer automatically.","Arithmetic on an Integer unboxes it first.","Unboxing a null Integer throws a NullPointerException."]},
{h:"Parsing text into numbers",p:"<p>Input from files and split comes as Strings. Parse to compute with them.</p>",
code:`String s = "125";
int n = Integer.parseInt(s);         // 125
double p = Double.parseDouble("4.75"); // 4.75

System.out.println(s + 1);    // "1251" (String joining)
System.out.println(n + 1);    // 126

// Integer.parseInt("12a")  -> NumberFormatException`,
logic:["\"125\" + 1 joins text; 125 + 1 adds numbers.","parseInt needs a String that contains only a whole number.","Integer.MAX_VALUE and Integer.MIN_VALUE are also in the Integer class (1.5)."]}],
mistakes:["Writing <code>ArrayList&lt;int&gt;</code>.","Forgetting to parse numbers that came from split.","Comparing two Integer objects with == (compares references); unbox or use equals."],
tip:"Any time data comes from a file or a String, look for where it needs parseInt or parseDouble."};

NOTES["4.8"]={
lo:[["4.8.A","Use ArrayList objects to represent collections of related objects, and determine the result of calling ArrayList methods.",[["4.8.A.1","An ArrayList can change size, and it holds object references."],["4.8.A.2","The ArrayList() constructor creates an empty list."],["4.8.A.3","Java allows the generic form ArrayList&lt;E&gt;, where E is the element type. Using it lets the compiler catch type errors."],["4.8.A.4","ArrayList is in java.util and must be imported."],["4.8.A.5","The tested methods (in the Java Quick Reference) are size(), add(obj) to append, add(index, obj) to insert and shift later elements right, get(index), set(index, obj) which returns the old element, and remove(index) which shifts later elements left and returns the removed element."],["4.8.A.6","Indexes go from 0 to size() − 1."]]]],
secs:[
{h:"Creating and changing a list",p:"<p>Unlike arrays, an ArrayList grows and shrinks as you add and remove.</p>",
code:`import java.util.ArrayList;

ArrayList<String> crew = new ArrayList<String>();   // []
crew.add("Kai");              // [Kai]
crew.add("Noor");             // [Kai, Noor]
crew.add(0, "Eli");           // [Eli, Kai, Noor]    (Kai and Noor shift right)
String old = crew.set(1, "Zed");  // [Eli, Zed, Noor], old is "Kai"
String gone = crew.remove(0);     // [Zed, Noor], gone is "Eli"
crew.size();                  // 2
crew.get(1);                  // "Noor"`,
logic:["add(index, obj) inserts and pushes everything after it one place right.","set replaces and returns what was there.","remove(index) returns the removed element and pulls everything after it one place left."]},
{h:"Arrays vs. ArrayLists",p:"<table><tr><th></th><th>Array</th><th>ArrayList</th></tr><tr><td>Size</td><td>fixed</td><td>changes</td></tr><tr><td>Length</td><td><code>arr.length</code></td><td><code>list.size()</code></td></tr><tr><td>Read</td><td><code>arr[i]</code></td><td><code>list.get(i)</code></td></tr><tr><td>Write</td><td><code>arr[i] = x</code></td><td><code>list.set(i, x)</code></td></tr><tr><td>Holds</td><td>primitives or objects</td><td>objects only</td></tr></table>",
code:`int[] arr = {4, 7, 1};
ArrayList<Integer> list = new ArrayList<Integer>();
list.add(4); list.add(7); list.add(1);

arr[1] = 9;          // array write
list.set(1, 9);      // list write
arr.length;          // 3
list.size();         // 3`,
logic:["Same idea, different syntax.","FRQ 3 is about ArrayLists, so the method names must be exact.","Out-of-range get/set/remove throws IndexOutOfBoundsException."]}],
mistakes:["Using <code>list[i]</code> or <code>list.length</code>.","Forgetting that add(index, obj) and remove shift the other elements.","Forgetting the import."],
tip:"After every add or remove in a trace question, rewrite the whole list with its indexes."};

NOTES["4.9"]={
lo:[["4.9.A","Write code that traverses an ArrayList, and determine the result.",[["4.9.A.1","Traversing an ArrayList uses iteration or recursion to visit all of its elements, or an ordered sequence of them."],["4.9.A.2","Deleting elements during a traversal needs special care so that no elements are skipped."],["4.9.A.3","Using an index outside the valid range throws an IndexOutOfBoundsException."],["4.9.A.4","Changing the size of an ArrayList (adding or removing) inside an enhanced for loop can throw a ConcurrentModificationException, so don't add or remove in that kind of loop."]]]],
secs:[
{h:"Traversing",p:"<p>Indexed loops use <code>size()</code> and <code>get(i)</code>. Enhanced for loops work for reading.</p>",
code:`ArrayList<Integer> temps = ...;   // [71, 88, 92, 65]

int hot = 0;
for (int t : temps) {
    if (t > 85) hot++;
}
// hot is 2

for (int i = 0; i < temps.size(); i++) {
    temps.set(i, temps.get(i) - 32);   // indexed loop to change values
}`,
logic:["Enhanced for loop for reading.","Indexed loop with set to change values.","Never use <code>temps.length</code>."]},
{h:"Removing safely",p:"<p>Removing an element shifts the rest left. If you then do <code>i++</code>, you skip the element that moved into position i.</p>",
code:`// BUG: skips elements
for (int i = 0; i < list.size(); i++) {
    if (list.get(i) < 0) list.remove(i);
}
// [-1, -2, 5] -> removes -1, then i = 1 looks at 5 -> [-2, 5]  (wrong)

// FIX 1: go backward
for (int i = list.size() - 1; i >= 0; i--) {
    if (list.get(i) < 0) list.remove(i);
}

// FIX 2: only move forward when nothing was removed
int i = 0;
while (i < list.size()) {
    if (list.get(i) < 0) {
        list.remove(i);
    } else {
        i++;
    }
}`,
logic:["Going backward means shifting affects only elements you've already checked.","In fix 2, i stays in place after a removal so the shifted element is checked next.","Both give [5] for the example."]}],
mistakes:["Removing inside an enhanced for loop.","Removing going forward with an unconditional i++.","Using <= size() in the loop condition."],
tip:"\"Remove all elements that…\" appears on FRQs often (2023 WeatherData). Use the backward loop; it's the hardest to get wrong."};

NOTES["4.10"]={
lo:[["4.10.A","Write standard and original ArrayList algorithms for a given context, and determine their result.",[["4.10.A.1","Standard ArrayList algorithms include all the array algorithms (min, max, sum, average, any/all, count, consecutive pairs, duplicates, shift, rotate, reverse) plus inserting and deleting elements."],["4.10.A.2","Some algorithms need to traverse two or more String, array, or ArrayList objects at the same time."]]]],
secs:[
{h:"Filtering into a new list",p:"<p>Build a new list instead of changing the original, especially when the problem says the original must not change.</p>",
code:`public static ArrayList<String> startsWith(ArrayList<String> words, String prefix) {
    ArrayList<String> result = new ArrayList<String>();
    for (String w : words) {
        if (w.indexOf(prefix) == 0) {
            result.add(w.substring(prefix.length()));
        }
    }
    return result;
}
// words = [catalog, dog, category, scat], prefix "cat"
// result = [alog, egory]`,
logic:["indexOf(prefix) == 0 means w starts with prefix. \"scat\" contains \"cat\" but not at index 0.","The prefix is removed with substring.","The original list is unchanged. This is close to 2024 FRQ 3."]},
{h:"Inserting in order",p:"<p>Find the first position where the new value belongs, then <code>add(index, value)</code>.</p>",
code:`// list is sorted: [10, 20, 40, 50]
int v = 30;
int pos = 0;
while (pos < list.size() && list.get(pos) < v) {
    pos++;
}
list.add(pos, v);     // [10, 20, 30, 40, 50]`,
logic:["The loop stops at the first element that is not less than v (40, at index 2).","The size check comes first, so short-circuiting prevents going out of bounds.","If v is larger than everything, pos becomes size() and add appends it."]},
{h:"Traversing two collections together",p:"<p>Use one loop for each collection (nested) when every pair must be compared, or a shared index when they line up.</p>",
code:`// Count students who appear in both lists (match by ID)
int both = 0;
for (Student a : history) {
    for (Student b : math) {
        if (a.getId() == b.getId()) {
            both++;
        }
    }
}`,
logic:["Every student in history is compared with every student in math.","The IDs are ints, so == is correct here; for String IDs use equals.","2026 FRQ 3 (Attendance) is this pattern with an extra comparison."]}],
mistakes:["Changing the original list when you should return a new one.","Checking get(pos) before checking pos &lt; size().","Using == to compare String fields."],
tip:"FRQ 3 always works with a list of objects. Call the given getter methods on each element; never assume field names."};

NOTES["4.11"]={
lo:[["4.11.A","Write code that uses 2D arrays to represent collections of related data.",[["4.11.A.1","A 2D array is stored as an array of arrays. Its size is fixed when created, and it can hold primitives or object references."],["EXCL","Non-rectangular 2D arrays (rows of different lengths) are not tested."],["4.11.A.2","When a 2D array is created with new, every element starts with its type's default value."],["4.11.A.3","Nested initializer lists can create and fill a 2D array."],["4.11.A.4","An element is accessed with two indexes, arr[row][col]: the first is the row and the second is the column."],["4.11.A.5","A whole row can be accessed with one index, arr[row]; it is a 1D array."],["4.11.A.6","arr.length is the number of rows and arr[0].length is the number of columns. Valid indexes run from 0 to one less than each. Any other index throws an ArrayIndexOutOfBoundsException."]]]],
secs:[
{h:"Creating and reading 2D arrays",p:"<p>Think of a grid: the first index picks the row, the second picks the column.</p>",
code:`int[][] seats = new int[3][4];      // 3 rows, 4 columns, all 0

int[][] m = { {5, 1, 7},
              {2, 9, 4} };
m[0][2];          // 7   (row 0, column 2)
m[1][0];          // 2
m.length;         // 2   rows
m[0].length;      // 3   columns
int[] row1 = m[1];  // {2, 9, 4}`,
logic:["Each inner {} is one row.","m[1] is a whole row, which is an ordinary 1D array.","m[2][0] would throw an exception: there are only rows 0 and 1."]},
{h:"2D arrays of objects",p:"<p>A new 2D array of objects is full of <code>null</code> until you put objects in it.</p>",
code:`String[][] board = new String[3][3];   // all null
board[1][1] = "X";
board[0][2] = "O";

if (board[2][2] == null) {
    System.out.println("empty");      // prints
}`,
logic:["Empty cells are null, so check for null before calling methods on an element.","2023 FRQ 4 (BoxOfCandy) uses null for empty spaces.","Use == null for the check, not equals."]}],
mistakes:["Swapping row and column indexes.","Using arr.length for the number of columns.","Calling a method on a null element."],
tip:"Label your loop variables row and col (not i and j) on FRQ 4. It prevents index swaps."};

NOTES["4.12"]={
lo:[["4.12.A","Write code that traverses a 2D array, and determine the result.",[["4.12.A.1","Nested iteration can traverse a 2D array in row-major order, column-major order, or another order."],["4.12.A.2","In nested enhanced for loops, the outer loop variable is a row (a 1D array) and the inner loop variable holds each element. Assigning to the inner variable does not change the array."]]]],
secs:[
{h:"Row-major and column-major",p:"<p>Row-major: finish a row, then go to the next. Column-major: finish a column, then go to the next.</p>",
code:`int[][] g = { {1, 2, 3},
              {4, 5, 6} };

// row-major: 1 2 3 4 5 6
for (int row = 0; row < g.length; row++)
    for (int col = 0; col < g[0].length; col++)
        System.out.print(g[row][col] + " ");

// column-major: 1 4 2 5 3 6
for (int col = 0; col < g[0].length; col++)
    for (int row = 0; row < g.length; row++)
        System.out.print(g[row][col] + " ");`,
logic:["The outer loop decides which order you get.","Inside, the access is always g[row][col].","Row bound: g.length. Column bound: g[0].length."]},
{h:"Nested enhanced for loops",p:"<p>Good for reading every element when you don't need the position.</p>",
code:`int total = 0;
for (int[] row : g) {       // row is a 1D array
    for (int val : row) {   // val is one element
        total += val;
    }
}
// total is 21`,
logic:["The outer variable's type is int[] because each row is an array.","Assigning to val would not change g.","Use indexed loops when you need row and col numbers."]}],
mistakes:["Using g.length as the column limit.","Writing g[col][row] in a column-major loop.","Declaring the outer enhanced-for variable as int instead of int[]."],
tip:"In column-major loops, only the loop order changes. The access stays g[row][col]."};

NOTES["4.13"]={
lo:[["4.13.A","Write standard and original 2D array algorithms for a given context, and determine their result.",[["4.13.A.1","Standard algorithms can be applied to a whole 2D array or to one row, one column, or another section. They include min or max, sum or average, checking whether at least one or all elements have a property, counting elements with a property, consecutive pairs, duplicates, shifting or rotating, and reversing."]]]],
secs:[
{h:"Working on one row or one column",p:"<p>Fix one index and loop over the other.</p>",
code:`// sum of row r
int rowSum = 0;
for (int col = 0; col < g[r].length; col++) {
    rowSum += g[r][col];
}

// max of column c
int colMax = g[0][c];
for (int row = 1; row < g.length; row++) {
    if (g[row][c] > colMax) colMax = g[row][c];
}`,
logic:["For a row, the row index stays fixed.","For a column, the column index stays fixed.","2026 FRQ 4 sums one row of objects and checks whether they all share a color."]},
{h:"Checking neighbors safely",p:"<p>Before looking at a neighbor, make sure it exists.</p>",
code:`// Count cells that are larger than the cell directly below them
int count = 0;
for (int row = 0; row < g.length - 1; row++) {     // stop one row early
    for (int col = 0; col < g[0].length; col++) {
        if (g[row][col] > g[row + 1][col]) {
            count++;
        }
    }
}`,
logic:["Stopping at g.length − 1 keeps row + 1 in bounds.","Use the same idea for right neighbors with g[0].length − 1.","For neighbors in any direction, check each index with an if before using it."]},
{h:"Searching and replacing",p:"<p>Return as soon as you find what you need.</p>",
code:`// Replace the first 0 found (row by row) with v; return true if replaced
public boolean fillFirstEmpty(int v) {
    for (int row = 0; row < grid.length; row++) {
        for (int col = 0; col < grid[0].length; col++) {
            if (grid[row][col] == 0) {
                grid[row][col] = v;
                return true;
            }
        }
    }
    return false;
}`,
logic:["The return inside the inner loop ends both loops.","return false comes only after every cell has been checked.","This is the shape of many FRQ 4 parts (b)."]}],
mistakes:["Neighbor checks that go out of bounds on the last row or column.","Returning false inside the loops too early.","Resetting a running total in the wrong loop."],
tip:"FRQ 4 rewards a clean double loop with correct bounds. Write the loop shell first, then fill in the body."};

NOTES["4.14"]={
lo:[["4.14.A","Write code that uses linear search, and determine the result of searches.",[["4.14.A.1","Linear search checks each element in order until the target is found or every element has been checked. It can start at either end of an array or ArrayList."],["4.14.A.2","To search a 2D array, apply a linear search to each row."]]]],
secs:[
{h:"Linear search on an array or ArrayList",p:"<p>Return the index as soon as the target is found; return −1 if it never is.</p>",
code:`public static int find(int[] a, int target) {
    for (int i = 0; i < a.length; i++) {
        if (a[i] == target) {
            return i;
        }
    }
    return -1;
}
find(new int[]{8, 3, 5, 3}, 3);   // 1  (first match)
find(new int[]{8, 3, 5, 3}, 9);   // -1

// Search from the end to find the LAST match
for (int i = a.length - 1; i >= 0; i--) {
    if (a[i] == target) return i;
}`,
logic:["Works on unsorted data.","When the target isn't there, every element is checked.","Starting at the end finds the last occurrence instead of the first."]},
{h:"Searching a 2D array",p:"<p>Run a linear search across each row in turn.</p>",
code:`public static boolean contains(String[][] grid, String target) {
    for (String[] row : grid) {
        for (String s : row) {
            if (s != null && s.equals(target)) {
                return true;
            }
        }
    }
    return false;
}`,
logic:["The outer loop picks each row; the inner loop is a linear search of that row.","The null check comes first so equals is never called on null.","Use equals for Strings and objects."]}],
mistakes:["Returning −1 inside the loop on the first mismatch.","Using == for String targets.","Off-by-one at the end of the array."],
tip:"Binary search is now part of 4.17. In 4.14, focus on linear search, including on 2D arrays."};

NOTES["4.15"]={
lo:[["4.15.A","Determine the result of each step of a sorting algorithm.",[["4.15.A.1","Selection sort and insertion sort are iterative algorithms that sort arrays and ArrayLists."],["4.15.A.2","Selection sort repeatedly finds the smallest (or largest) element in the unsorted part and swaps it into its final position."],["4.15.A.3","Insertion sort takes each element from the unsorted part and inserts it into the correct place in the sorted part by shifting larger elements over."]]]],
secs:[
{h:"Selection sort",p:"<p>Each pass finds the minimum of what's left and swaps it to the front of the unsorted part. At most one swap per pass.</p>",
code:`public static void selectionSort(int[] a) {
    for (int i = 0; i < a.length - 1; i++) {
        int minIndex = i;
        for (int j = i + 1; j < a.length; j++) {
            if (a[j] < a[minIndex]) minIndex = j;
        }
        int temp = a[i];
        a[i] = a[minIndex];
        a[minIndex] = temp;
    }
}
// {5, 3, 8, 1, 4}
// pass 1: {1, 3, 8, 5, 4}
// pass 2: {1, 3, 8, 5, 4}   (3 already in place)
// pass 3: {1, 3, 4, 5, 8}
// pass 4: {1, 3, 4, 5, 8}`,
logic:["After pass k, the first k elements are final.","The inner loop only looks; the swap happens once after it.","It makes the same number of comparisons even if the array is already sorted."]},
{h:"Insertion sort",p:"<p>Grow a sorted section on the left. Take the next element and shift bigger ones right until its spot opens up.</p>",
code:`public static void insertionSort(int[] a) {
    for (int i = 1; i < a.length; i++) {
        int key = a[i];
        int j = i - 1;
        while (j >= 0 && a[j] > key) {
            a[j + 1] = a[j];     // shift right
            j--;
        }
        a[j + 1] = key;
    }
}
// {5, 3, 8, 1, 4}
// i=1: {3, 5, 8, 1, 4}
// i=2: {3, 5, 8, 1, 4}
// i=3: {1, 3, 5, 8, 4}
// i=4: {1, 3, 4, 5, 8}`,
logic:["The left part is always sorted, but not final: later values can be inserted into it.","On nearly-sorted data, the while loop barely runs, so insertion sort is fast.","Check j &gt;= 0 first (short-circuit) so a[j] never goes out of bounds."]}],
mistakes:["Mixing up the two sorts' intermediate states.","Thinking selection sort's sorted part can change later (it can't); insertion sort's can.","Counting a pass as starting at index 0 for insertion sort (it starts at 1)."],
tip:"Exam questions ask \"what does the array look like after pass k\". Write out every pass; don't jump ahead."};

NOTES["4.16"]={
lo:[["4.16.A","Determine the result of calling recursive methods.",[["4.16.A.1","A recursive method calls itself. It has at least one base case that stops the recursion and at least one recursive call."],["4.16.A.2","Each recursive call has its own copies of local variables and parameters, which keep track of that call's progress."],["4.16.A.3","Any recursive solution can be written iteratively, and any iterative one recursively."],["EXCL","Writing recursive code is not tested; you must be able to trace it."]]]],
secs:[
{h:"Base case and recursive call",p:"<p>Every recursive call must move toward the base case, or the program runs out of memory (StackOverflowError).</p>",
code:`public static int sumTo(int n) {
    if (n == 0) {              // base case
        return 0;
    }
    return n + sumTo(n - 1);   // recursive call, closer to 0
}
// sumTo(4)
// = 4 + sumTo(3)
// = 4 + 3 + sumTo(2)
// = 4 + 3 + 2 + sumTo(1)
// = 4 + 3 + 2 + 1 + sumTo(0)
// = 4 + 3 + 2 + 1 + 0 = 10`,
logic:["Each call waits for the call it made to return.","sumTo(0) returns without another call, which starts the chain of returns.","The same result comes from a for loop adding 1 to n."]},
{h:"Tracing output order",p:"<p>Where the print sits relative to the recursive call decides the output order.</p>",
code:`public static void countdown(int n) {
    if (n > 0) {
        System.out.print(n + " ");
        countdown(n - 1);
    }
}
public static void countup(int n) {
    if (n > 0) {
        countup(n - 1);
        System.out.print(n + " ");
    }
}
countdown(3);   // 3 2 1
countup(3);     // 1 2 3`,
logic:["countdown prints before going deeper, so the biggest number comes first.","countup goes all the way down first and prints on the way back.","Each call has its own n, so the values aren't lost."]},
{h:"Recursion with Strings",p:"<p>Many exam questions use substring to make the String smaller each call.</p>",
code:`public static int countA(String s) {
    if (s.length() == 0) return 0;
    if (s.substring(0, 1).equals("a")) {
        return 1 + countA(s.substring(1));
    }
    return countA(s.substring(1));
}
// countA("banana") -> 3`,
logic:["Each call looks at the first character and recurses on the rest.","The base case is the empty String.","Trace with a stack of calls written top to bottom."]}],
mistakes:["Missing or unreachable base case.","Forgetting that work after the recursive call happens on the way back.","Losing track of which call's variables you're looking at."],
tip:"Trace recursion with a call stack: write each call on a new line, indent it, and fill in return values from the bottom up."};

NOTES["4.17"]={
lo:[["4.17.A","Determine the result of recursive algorithms that work with Strings or collections.",[["4.17.A.1","Recursion can be used to traverse Strings, arrays, and ArrayLists."]]],
["4.17.B","Determine the result of each iteration of binary search.",[["4.17.B.1","Binary search works only on sorted data. It starts at the middle of a sorted array or ArrayList and removes half of the remaining elements each time, until it finds the target or there are no elements left."],["4.17.B.2","Binary search is usually more efficient than linear search."],["4.17.B.3","Binary search can be written iteratively or recursively."],["EXCL","Search algorithms other than linear and binary search are not tested."]]],
["4.17.C","Determine the result of each step of merge sort.",[["4.17.C.1","Merge sort is a recursive algorithm that can sort an array or ArrayList."],["4.17.C.2","Merge sort keeps splitting the array in half until each piece has one element, then merges the pieces back together in sorted order."],["EXCL","Sorting algorithms other than selection, insertion, and merge sort are not tested."]]]],
secs:[
{h:"Recursive traversal",p:"<p>Pass an index that moves forward each call; stop when it reaches the end.</p>",
code:`public static int sum(int[] a, int i) {
    if (i == a.length) return 0;
    return a[i] + sum(a, i + 1);
}
sum(new int[]{4, 1, 6}, 0);   // 11`,
logic:["The index i plays the role of a loop variable.","The base case is going past the last index.","Same result as an indexed for loop."]},
{h:"Binary search",p:"<p>Look at the middle. If it's too small, search the right half; too big, search the left half.</p>",
code:`public static int binarySearch(int[] a, int target, int lo, int hi) {
    if (lo > hi) return -1;                  // nothing left
    int mid = (lo + hi) / 2;
    if (a[mid] == target) return mid;
    if (a[mid] < target) return binarySearch(a, target, mid + 1, hi);
    return binarySearch(a, target, lo, mid - 1);
}

// a = {3, 8, 12, 19, 25, 31, 40}, target 31
// lo=0 hi=6 mid=3 (19) -> go right
// lo=4 hi=6 mid=5 (31) -> found at 5`,
logic:["Each call throws away half of what's left, so even 1,000,000 sorted items need only about 20 checks.","On unsorted data the answer can be wrong.","The iterative version uses a while (lo &lt;= hi) loop with the same steps."]},
{h:"Merge sort",p:"<p>Split until pieces have one element, then merge pairs of sorted pieces by repeatedly taking the smaller front element.</p>",
code:`// {38, 27, 43, 3, 9, 82, 10}
// split:  {38, 27, 43, 3}          {9, 82, 10}
//         {38, 27} {43, 3}         {9, 82} {10}
//         {38}{27} {43}{3}         {9}{82} {10}
// merge:  {27, 38} {3, 43}         {9, 82} {10}
//         {3, 27, 38, 43}          {9, 10, 82}
//         {3, 9, 10, 27, 38, 43, 82}`,
logic:["One-element pieces are already sorted (the base case).","Merging two sorted lists takes the smaller front value each time.","Merge sort is much faster than selection or insertion sort on large data, but it needs extra memory for the merged pieces."]}],
mistakes:["Using binary search on unsorted data.","Computing mid wrong or forgetting to move lo/hi past mid.","Writing out merge steps in the wrong order."],
tip:"For binary search questions, make a table with lo, hi, mid, and a[mid] for each step."};

const ALL=[];UNITS.forEach(u=>u.topics.forEach(t=>ALL.push({unit:u,id:t[0],title:t[1],goals:t[2],code:t[3],q:t[4],a:t[5],note:t[6],x:EX[t[0]]})));
const BY_ID={};ALL.forEach(t=>BY_ID[t.id]=t);
const CED_URL="https://apcentral.collegeboard.org/media/pdf/ap-computer-science-a-revised-framework-preview.pdf";

// Every topic's quiz: the lesson question from EX first, then the bank. Format: {id, topic, stem, code, opts (correct first), expl}
function quizFor(id){
  const e=EX[id][2];
  const first=[e[2][e[3]],...e[2].filter((_,k)=>k!==e[3])];
  const list=[{stem:e[0],code:e[1],opts:first,expl:e[4]}].concat((QB[id]||[]).map(q=>({stem:q[0],code:q[1],opts:q[2],expl:q[3]})));
  return list.map((q,k)=>Object.assign(q,{qid:id+"-"+(k+1),topic:id}));
}
const TOTAL_Q=ALL.reduce((s,t)=>s+quizFor(t.id).length,0);

const KEY="csa-hub-done";
let done={};try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(src){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*")|\b(public|private|static|void|int|double|boolean|String|class|new|return|if|else|for|while|import|null|true|false|this|throws|final)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out="",last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));
    const cls=m[1]?"c":m[2]?"s":m[3]?"k":"d";out+=`<span class="${cls}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(src.slice(last));
}
// Seeded shuffle so each question's choices stay in the same order every visit
